const esc = s => String(s).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const WD = ['شنبه','یکشنبه','دوشنبه','سه‌شنبه','چهارشنبه','پنجشنبه','جمعه'];
const SWD = ['ش','ی','د','س','چ','پ','ج'];
const faD = n => String(n).replace(/\d/g,d=>'۰۱۲۳۴۵۶۷۸۹'[d]);
const wdIdx = d => (d.getDay()+1)%7;                       // 0 = Saturday
const LAST7 = (()=>{ const a=[]; for(let k=6;k>=0;k--){ const d=new Date(TODAY); d.setDate(d.getDate()-k); a.push(d); } return a; })();
const hash = s => { let h=7; for(const c of String(s)) h=(h*31+c.charCodeAt(0))%9973; return h; };
/* x for right-to-left time axes: oldest point on the right */
const xr = (i,n,W,pl,pr) => W-pr-(n<=1?0:i/(n-1))*(W-pl-pr);
function sparkPath(vals,W,H,pad=2){ const mx=Math.max(1,...vals), mn=Math.min(...vals,0);
  return vals.map((v,i)=>`${i?'L':'M'}${xr(i,vals.length,W,pad,pad).toFixed(1)},${(H-pad-(v-mn)/(mx-mn||1)*(H-pad*2)).toFixed(1)}`).join(''); }
function spark(vals,{w=120,h=32,col='var(--d4)',area=false,label=''}={}){ const p=sparkPath(vals,w,h);
  const a = area ? `<path d="${p}L${xr(vals.length-1,vals.length,w,2,2)},${h}L${xr(0,vals.length,w,2,2)},${h}Z" fill="${col}" opacity=".14"/>` : '';
  const last=vals.length-1, mx=Math.max(1,...vals), mn=Math.min(...vals,0);
  return `<svg class="spk" viewBox="0 0 ${w} ${h}" width="${w}" height="${h}" role="img" aria-label="${label}">${a}<path d="${p}" fill="none" stroke="${col}" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/><circle cx="${xr(last,vals.length,w,2,2)}" cy="${h-2-(vals[last]-mn)/(mx-mn||1)*(h-4)}" r="2.6" fill="${col}"/></svg>`; }
function ring(pct,{size=56,stroke=6,col='var(--d4)',plan=null,label=''}={}){ const r=(size-stroke)/2, C=2*Math.PI*r, cx=size/2;
  const tick = plan==null?'':(()=>{ const a=-Math.PI/2+plan/100*2*Math.PI; const x1=cx+(r-stroke)*Math.cos(a), y1=cx+(r-stroke)*Math.sin(a), x2=cx+(r+stroke)*Math.cos(a), y2=cx+(r+stroke)*Math.sin(a); return `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="var(--text)" stroke-width="2.4" stroke-linecap="round"/>`; })();
  return `<svg viewBox="0 0 ${size} ${size}" width="${size}" height="${size}" role="img" aria-label="${label}" class="ring"><circle cx="${cx}" cy="${cx}" r="${r}" fill="none" stroke="var(--surface-2)" stroke-width="${stroke}"/>
    <circle cx="${cx}" cy="${cx}" r="${r}" fill="none" stroke="${col}" stroke-width="${stroke}" stroke-dasharray="${C*pct/100} ${C}" stroke-linecap="round" transform="rotate(-90 ${cx} ${cx}) scale(1 1)"/>${tick}
    <text x="${cx}" y="${cx+4.5}" text-anchor="middle" class="rt">${faPct(pct)}</text></svg>`; }
const card = (id,icon,title,body,o={}) => `<section class="card ${o.cls||''}" aria-labelledby="${id}" ${o.attr||''}><div class="card-h"><span class="ic-badge ${o.c?'c':''}">${ic(icon)}</span><h2 id="${id}">${title}</h2>${o.act?`<div class="act">${o.act}</div>`:''}</div>${body}</section>`;

function m1PopTimes(mv){ const c=mv.st.ctx, key=c.hood||c.reg||c.city||c.prov||'ir', s=hash(key);
  const base=[1,.86,.8,.92,.7,.4,.05].map((v,i)=>Math.round(v*(18+s%23)*(0.8+((s>>i)%5)/10)));
  const today=wdIdx(TODAY), mx=Math.max(...base), top=base.indexOf(mx);
  const now = Math.round(base[today]*1.35);
  return `<div class="pt"><div class="pt-h"><b>ثبت‌ها در روزهای هفته</b><small>میانگین ۸ هفته اخیر در همین محدوده</small></div>
    <div class="pt-bars" role="img" aria-label="بیشترین ثبت در روز ${WD[top]}؛ امروز ${fa(now)} ثبت، بیشتر از میانگین">${base.map((v,i)=>`<div class="${i===today?'td':''}"><i style="height:${Math.max(4,v/mx*56)}px">${i===today?`<u style="height:${Math.min(64,now/mx*56)}px"></u>`:''}</i><span>${SWD[i]}</span></div>`).join('')}</div>
    <p class="pt-n"><span class="live-dot"></span><b>امروز ${fa(now)} ثبت</b>؛ بیشتر از یک ${WD[today]} معمولی. شلوغ‌ترین روز: ${WD[top]}.</p></div>`; }
function m1Projects(mv){ const c=mv.st.ctx; let list=PP, where='کل کشور';
  if(c.hood){ list=PP.filter(p=>p.h===c.hood); where='محله '+hoodBy[c.hood].n; }
  else if(c.city){ list=PP.filter(p=>hoodBy[p.h].city===c.city); where='شهر '+cityBy[c.city].n; }
  else if(c.prov){ list=PP.filter(p=>cityBy[hoodBy[p.h].city].p===c.prov); where='استان '+provBy[c.prov].fa; }
  if(!list.length) return `<div class="empty">${ic('hand')}<b>در ${where} پروژه مشارکتی ثبت نشده</b><p>اگر قراردادی امضا شده، آن را ثبت کنید تا پیشرفتش اینجا دیده شود.</p><button class="btn pri sm">${ic('plus','s')} ثبت پروژه مشارکتی</button></div>`;
  return `<div class="sh-meta">${fa(list.length)} پروژه در ${where}${list.some(p=>p.late)?` · <b class="dn">${fa(list.filter(p=>p.late).length)} عقب</b>`:''}</div>
   <div class="pcards">${list.slice().sort((a,b)=>b.gap-a.gap).map(p=>`<article class="pcard">
     <div class="thumb" aria-hidden="true">${ic('building')}</div>
     <div class="m"><b>${p.nm}</b><small>${p.city} · ${p.co}</small><span class="pill ${p.health}">${HEALTH[p.health]}</span></div>
     ${ring(p.pr,{size:54,stroke:6,col:p.late?'var(--coral-700)':'var(--d4)',plan:p.plan,label:`پیشرفت ${faPct(p.pr)}، برنامه ${faPct(p.plan)}`})}
     <button class="btn sm" data-goh="${p.h}">${ic('loc','s')} روی نقشه</button></article>`).join('')}</div>
   <p class="hint"><i class="tk"></i> خط کوچک روی دایره یعنی جایی که طبق برنامه باید باشد.</p>`; }
function m1Activity(mv){ const c=mv.st.ctx; const pc=c.city||(c.prov?D.cities.filter(x=>x.p===c.prov).map(x=>x.id):null);
  const list = pc? EX.filter(e=>[].concat(pc).includes(e.at)) : EX; const on=list.filter(e=>e.on).length;
  if(!list.length) return `<div class="empty">${ic('users')}<b>کارشناسی در این محدوده کار نکرده</b><p>برای این محدوده کارشناس تعیین کنید.</p><button class="btn sm">تعیین کارشناس</button></div>`;
  return `<div class="sh-meta">${fa(list.length)} کارشناس در این محدوده · ${fa(on)} نفر امروز فعال</div>
    <div class="revs">${list.map(e=>`<article class="rev"><span class="av" aria-hidden="true">${e.ini}${e.on?'<i class="on"></i>':''}</span><div class="m"><b>${e.n}</b><small>${e.r} · ${fa(e.tot)} کار در این هفته</small><p>${e.last}</p><time>${e.ago}</time></div></article>`).join('')}</div>`; }
function m1Sheet(mv){ const el=$('.m-area',mv.root); if(!el) return;
  if(!el.dataset.ready){ el.dataset.ready='1'; el.classList.add('m-sheet');
    el.innerHTML=`<div class="sh-tabs" role="tablist" aria-label="اطلاعات محدوده">${[['sum','خلاصه'],['proj','پروژه‌ها'],['act','کارشناسان']].map((t,i)=>`<button role="tab" data-tab="${t[0]}" aria-selected="${!i}">${t[1]}</button>`).join('')}</div><div class="sh-body" role="tabpanel"></div>`;
    $$('[data-tab]',el).forEach(b=>b.onclick=()=>{ mv._tab=b.dataset.tab; $$('[data-tab]',el).forEach(x=>x.setAttribute('aria-selected',x===b)); m1Sheet(mv); }); }
  const body=$('.sh-body',el), tab=mv._tab||'sum';
  if(tab==='sum'){ mv.renderArea(body); body.insertAdjacentHTML('beforeend', m1PopTimes(mv)); }
  else if(tab==='proj') body.innerHTML=m1Projects(mv);
  else body.innerHTML=m1Activity(mv);
  $$('[data-goh]',body).forEach(b=>b.onclick=()=>mv.goBounds(mv.hoodL[b.dataset.goh].getBounds(),4)); }

function m2Ask(){ return `<section class="card nlf" data-nlf aria-label="فیلتر با زبان ساده"><div class="nlf-in"><span class="sparkle" aria-hidden="true">${ic('spark')}</span>
  <input data-nlq placeholder="بنویسید چه می‌خواهید ببینید؛ مثلاً «پیش‌نویس‌های قدیمی تهران»" aria-label="فیلتر با زبان ساده، دستیار آن را به فیلتر تبدیل می‌کند"><button class="btn pri" data-nlgo>اعمال</button></div>
  <div class="nlf-row"><div class="nlf-sug">${NLF.map((q,i)=>`<button class="chip" data-nl="${i}">${q.t}</button>`).join('')}</div><div class="nlf-tok" aria-live="polite"></div></div></section>`; }
function wireM2Ask(M,mv){ const box=$('[data-nlf]',M), tok=$('.nlf-tok',box);
  const apply=q=>{ mv.setStatus('all'); q.run(mv); tok.innerHTML=`<span class="say">${ic('spark','s')} ${q.say}</span>${q.tok.map(t=>`<span class="tok">${t}</span>`).join('')}<button class="link" data-clr>پاک کردن</button>`;
    $('[data-clr]',tok).onclick=()=>{ tok.innerHTML=''; mv.setStatus('all'); mv.goLevel(0); }; };
  $$('[data-nl]',box).forEach(b=>b.onclick=()=>apply(NLF[+b.dataset.nl]));
  const inp=$('[data-nlq]',box); const go=()=>{ const v=inp.value.trim(); if(!v){ inp.focus(); return; } const q=NLF.find(x=>x.t.split(' ').some(w=>w.length>3&&v.includes(w)))||{tok:['جستجو: '+v],run:()=>{},say:'نمونه تعاملی: در نسخه نهایی دستیار جمله شما را به فیلترهای قابل ویرایش تبدیل می‌کند.'}; apply(q); };
  $('[data-nlgo]',box).onclick=go; inp.onkeydown=e=>{ if(e.key==='Enter') go(); }; }
function m2Leader(){ const rows=EX.slice();
  const body=k=>rows.slice().sort((a,b)=>b[k]-a[k]).map((e,i)=>`<tr><td><span class="rk num">${fa(i+1)}</span></td><td><div class="who"><span class="av" aria-hidden="true">${e.ini}${e.on?'<i class="on"></i>':''}</span><div><b>${e.n}</b><small>${e.r}</small></div></div></td>
    <td>${spark(e.wk,{w:84,h:26,col:'var(--d4)',label:`کار روزانه ${e.n}`})}</td><td class="num"><b>${fa(e.tot)}</b></td><td class="num ${e.open>CAP?'dn':''}">${fa(e.open)}</td><td class="t">${e.ago}</td></tr>`).join('');
  return card('lb-h','users','کارشناسان در این هفته',`<p class="lead"><strong>${fa(EX.filter(e=>e.tot>20).length)} نفر</strong> بیشتر از ۲۰ کار ثبت کرده‌اند. <strong class="dn">${EX.filter(e=>e.open>CAP)[0].n}</strong> بیش از ${fa(CAP)} کار باز دارد.</p>
    <div class="tbl-w"><table class="tbl" data-lb><caption class="sr">رتبه‌بندی کارشناسان</caption><thead><tr><th scope="col">#</th><th scope="col">کارشناس</th><th scope="col">۷ روز اخیر</th><th scope="col"><button class="sort" data-k="tot" aria-pressed="true">ثبت هفته</button></th><th scope="col"><button class="sort" data-k="open" aria-pressed="false">کار باز</button></th><th scope="col">آخرین کار</th></tr></thead><tbody>${body('tot')}</tbody></table></div>
    <div class="src">ستون «کار باز» یعنی پیش‌نویس یا مورد برگشتی که هنوز بسته نشده. <span class="need">نیاز به ثبت‌کننده در سامانه</span></div>`,{attr:'data-lbw'}); }
function wireLeader(M){ $$('[data-lbw]',M).forEach(sec=>{ const tb=$('tbody',sec); $$('.sort',sec).forEach(b=>b.onclick=()=>{ $$('.sort',sec).forEach(x=>x.setAttribute('aria-pressed',x===b)); const k=b.dataset.k;
  const html=EX.slice().sort((a,c)=>c[k]-a[k]).map((e,i)=>`<tr><td><span class="rk num">${fa(i+1)}</span></td><td><div class="who"><span class="av" aria-hidden="true">${e.ini}${e.on?'<i class="on"></i>':''}</span><div><b>${e.n}</b><small>${e.r}</small></div></div></td><td>${spark(e.wk,{w:84,h:26,label:'کار روزانه '+e.n})}</td><td class="num"><b>${fa(e.tot)}</b></td><td class="num ${e.open>CAP?'dn':''}">${fa(e.open)}</td><td class="t">${e.ago}</td></tr>`).join(''); tb.innerHTML=html; }); }); }
function m2Dumbbell(){ const list=PP.slice().sort((a,b)=>b.gap-a.gap);
  return card('db-h','hand','پروژه‌های مشارکتی: فاصله تا برنامه',`<p class="lead">هرچه خط بلندتر، پروژه از برنامه عقب‌تر است. <strong class="dn">${fa(PP.filter(p=>p.late).length)} پروژه</strong> بیش از ۱۵٪ فاصله دارند.</p>
    <div class="dbl"><div class="dbx" aria-hidden="true"><span></span><span class="ax"><b style="right:0">۰٪</b><b style="right:50%">۵۰٪</b><b style="right:100%">۱۰۰٪</b></span></div>
    ${list.map(p=>{ const a=Math.min(p.pr,p.plan), b=Math.max(p.pr,p.plan); return `<div class="dbr ${p.late?'late':''}" role="img" aria-label="${p.nm}: پیشرفت ${faPct(p.pr)}، برنامه ${faPct(p.plan)}"><div class="nm"><b>${p.nm}</b><small>${p.city}</small></div>
      <div class="trk"><i class="ln" style="right:${a}%;width:${b-a}%"></i><i class="pl" style="right:${p.plan}%"></i><i class="ac" style="right:${p.pr}%"></i>${p.gap>3?`<em style="right:${(a+b)/2}%">${fa(p.gap)}٪</em>`:''}</div></div>`; }).join('')}</div>

function m2Multiples(){ return `<section class="card" data-sm aria-labelledby="sm-h"><div class="card-h"><span class="ic-badge">${ic('chart')}</span><h2 id="sm-h">روند ثبت، سه نوع داده کنار هم</h2>
   <div class="act"><div class="seg" role="group" aria-label="بازه زمانی" data-smp><button aria-pressed="false" data-v="30">۳۰ روز</button><button aria-pressed="true" data-v="90">۳ ماه</button><button aria-pressed="false" data-v="365">۱۲ ماه</button></div>
   <label class="tgl"><input type="checkbox" data-sms> مقیاس یکسان</label></div></div><div class="smg"></div><div class="src">هر ستون یک هفته (در ۱۲ ماه، یک ماه). مقیاس جدا یعنی شکل روند هر نوع را بهتر می‌بینید؛ مقیاس یکسان یعنی حجم‌ها را مقایسه می‌کنید.</div></section>`; }
function initMultiples(M){ $$('[data-sm]',M).forEach(sec=>{ const st={p:90,same:false}; const grid=$('.smg',sec);
  const agg=(arr,p)=>{ const step=p===30?1:p===90?7:30, n=p===30?30:p===90?13:12; const out=[]; for(let i=n-1;i>=0;i--){ const e=arr.length-i*step; out.push(sum(arr.slice(e-step,e))); } return out; };
  const draw=()=>{ const sets=Object.entries(TYPES).map(([k,t])=>{ const cur=agg(SERIES[k],st.p), prev=agg(SERIES[k].slice(0,-st.p),st.p); return {k,t,cur,T:sum(cur),P:sum(prev)}; });
    const gmax=Math.max(...sets.flatMap(s=>s.cur));
    grid.innerHTML=sets.map(s=>{ const mx=st.same?gmax:Math.max(...s.cur), W=300, H=110, n=s.cur.length, bw=(W-8)/n; const d=s.P?Math.round((s.T-s.P)/s.P*100):0;
      const bars=s.cur.map((v,i)=>`<rect x="${W-4-(i+1)*bw+bw*0.12}" y="${H-4-v/mx*(H-14)}" width="${bw*0.76}" height="${Math.max(1,v/mx*(H-14))}" rx="2" fill="${i===n-1?'var(--d5)':'var(--d2)'}"><title>${fa(v)}</title></rect>`).join('');
      return `<div class="sm"><div class="sm-h"><b>${s.t.fa}</b><span class="num big">${fa(s.T)}</span><span class="d ${d>=0?'up':'dn'}">${d>=0?'▲':'▼'} ${faPct(Math.abs(d))}</span></div>
        <svg viewBox="0 0 ${W} ${H}" class="chart" role="img" aria-label="${s.t.fa}: ${fa(s.T)} ثبت، ${faPct(Math.abs(d))} ${d>=0?'بیشتر':'کمتر'} از دوره قبل"><line x1="0" x2="${W}" y1="${H-4}" y2="${H-4}" stroke="var(--line-2)"/>${bars}</svg>
        <div class="sm-f"><span>${jal.format(SERIES.dates[SERIES.dates.length-st.p])}</span><span>امروز</span></div></div>`; }).join(''); };
  $$('[data-smp] button',sec).forEach(b=>b.onclick=()=>{ $$('[data-smp] button',sec).forEach(x=>x.setAttribute('aria-pressed',x===b)); st.p=+b.dataset.v; draw(); });
  $('[data-sms]',sec).onchange=e=>{ st.same=e.target.checked; draw(); }; draw(); }); }

const LAYER_WHY = {prop:'۷۲٪ املاک فقط در ۴ استان ثبت شده‌اند؛ تهران به‌تنهایی ۲۷٪.', land:'زمین‌ها بیشتر در حاشیه شهرها هستند؛ ۴۰٪ در اصفهان.', street:'۶۴٪ معابر ثبت‌شده «نیاز به بهسازی» یا «فرسوده»‌اند.', feat:'بیشتر عوارض مکانی فضای سبز و بناهای تاریخی‌اند.', proj:'۲ پروژه از ۷ پروژه مشارکتی عقب‌اند؛ هر دو در اصفهان.'};
function syncLayers3(mv){ const el=$('[data-lp]'); if(!el) return; const lv=mv.lv, L0=mv.st.layers; const open=el.dataset.open||'';
  el.innerHTML=`<h3>سطح نقشه</h3><div class="lvl-dots">${LV.map((l,i)=>`<button class="${i===lv?'on':i<lv?'past':''}" data-lv="${i}" ${i===lv?'aria-current="true"':''}>${l.fa}</button>`).join('')}</div>
    <h3 style="margin-top:12px">لایه‌ها</h3>${LAYERS.map(l=>`<div class="lrow2"><button class="lrow" data-l="${l.k}" aria-pressed="${L0[l.k]}"><span class="sw-tg" aria-hidden="true"></span><i class="lg-sw" style="background:var(${l.sw})"></i><span class="nm">${l.fa}</span><span class="cnt num">${fa(l.n)}</span></button><button class="why" data-why="${l.k}" aria-expanded="${open===l.k}" aria-label="توضیح دستیار درباره لایه ${l.fa}">${ic('spark','s')}</button></div>${open===l.k?`<p class="why-a">${LAYER_WHY[l.k]}</p>`:''}`).join('')}`;
  $$('[data-lv]',el).forEach(r=>r.onclick=()=>mv.goLevel(+r.dataset.lv));

  c.setOption({textStyle:{fontFamily:FONT},animation:!RM,animationDuration:700,animationEasing:'cubicOut',...opt});
  const ro=new ResizeObserver(()=>{ if(!c.isDisposed()) c.resize(); }); ro.observe(el);
  cleanup.push(()=>{ ro.disconnect(); if(!c.isDisposed()) c.dispose(); }); el._c=c; c.on('finished',()=>fixBidi(el)); fixBidi(el); return c; }
const FA_RE=/[\u0600-\u06FF]/;
function fixBidi(el){ el.querySelectorAll('text,tspan').forEach(t=>{ if(t.children.length) return; const s=t.textContent; if(s&&FA_RE.test(s)&&s[0]!=='\u202B') t.textContent='\u202B'+s+'\u202C'; }); }

const JP = new Intl.DateTimeFormat('en-u-ca-persian-nu-latn',{year:'numeric',month:'numeric'});
const jkey = d => { const p=JP.formatToParts(d); return p.find(x=>x.type==='year').value+'-'+p.find(x=>x.type==='month').value; };
const MSER = (()=>{ const m=new Map(); SERIES.dates.forEach((d,i)=>{ const k=jkey(d); if(!m.has(k)) m.set(k,{d,prop:0,land:0,street:0}); const o=m.get(k); o.prop+=SERIES.prop[i]; o.land+=SERIES.land[i]; o.street+=SERIES.street[i]; });
  return [...m.values()].slice(-13,-1).map(o=>({...o, n:jalMon.format(o.d)})); })();
const dayTot = i => SERIES.prop[i]+SERIES.land[i]+SERIES.street[i];
const weekly = (k,n) => { const a=[]; const L=SERIES[k].length; for(let w=n-1;w>=0;w--){ let s=0; for(let j=0;j<7;j++) s+=SERIES[k][L-1-w*7-j]; a.push(s); } return a; };
const ma7 = a => a.map((_,i)=>{ const s=a.slice(Math.max(0,i-6),i+1); return Math.round(sum(s)/s.length*10)/10; });
const shortName = n => n.split(' ')[0];

function m7Flow(){ const W=1000,H=330,y0=46,K=200/STAGES[0].reached, nw=14; const X=i=>W-50-i*((W-100)/5); const big=STAGES.slice(0,5).reduce((a,s)=>s.stay>a.stay?s:a);
  let g=''; STAGES.forEach((s,i)=>{ const x=X(i), h=s.reached*K;
    if(i<5){ const nx=X(i+1), hn=STAGES[i+1].reached*K, hs=s.stay*K; const xs=x-nw/2, xt=nx+nw/2, xm=(xs+xt)/2;
      g+=`<path class="fl" d="M${xs},${y0} C${xm},${y0} ${xm},${y0} ${xt},${y0} L${xt},${y0+hn} C${xm},${y0+hn} ${xm},${y0+hn} ${xs},${y0+hn} Z"/>`;
      const sx=(x+nx)/2, sy=258, isB=s===big; const tx=sx+7;
      g+=`<path class="dr ${isB?'big':''}" d="M${xs},${y0+hn} C${xs-40},${y0+hn} ${tx},${sy-60} ${tx},${sy} L${tx-14},${sy} C${tx-14},${sy-40} ${xs-30},${y0+h} ${xs},${y0+h} Z" style="opacity:${hs>2?1:.6}"/>`;
      g+=`<g class="sn ${isB?'big':''}" data-st="${s.k}" tabindex="0" role="button" aria-label="${fa(s.stay)} محله در ${s.fa} مانده‌اند؛ نمایش روی نقشه"><rect x="${tx-14}" y="${sy}" width="14" height="${Math.max(6,hs*0.5)}" rx="3"/><text x="${tx-7}" y="${sy+Math.max(6,hs*.5)+16}" text-anchor="middle"><tspan class="n">${fa(s.stay)}</tspan> مانده</text></g>`; }
    g+=`<rect class="nd ${i===5?'fin':''}" x="${x-nw/2}" y="${y0}" width="${nw}" height="${h}" rx="4"/><text class="lb" x="${x}" y="${y0-24}" text-anchor="middle">${s.fa}</text><text class="lbn" x="${x}" y="${y0-8}" text-anchor="middle">${fa(s.reached)} محله</text>`; });
  return `<section class="card flow" aria-labelledby="fl-h"><div class="fl-h"><div><p class="eyebrow">مسیر پرونده‌ی محله · ۶ مرحله</p><h2 id="fl-h">از ${fa(STAGES[0].reached)} محله، ${fa(STAGES[5].reached)} محله به آخر مسیر رسیده‌اند</h2></div>

    <div class="fl-sc"><svg viewBox="0 0 ${W} ${H}" class="flsvg" role="img" aria-label="نمودار جریان محله‌ها در شش مرحله؛ بیشترین توقف در ${big.fa}">${g}</svg></div></section>`; }
