<style>/* Layout: product shell (sidebar on the right, RTL) + one main column. Light mode only, map first, then action, then progress. */
:root{
  color-scheme:light;
  --bg:#F8FAFC; --surface:#FFFFFF; --surface-2:#F5F5F5; --line:#E5E5E5; --line-2:#D4D4D4;
  --text:#171717; --muted:#525252; --faint:#737373;
  --primary:#0F766E; --primary-700:#0C5E58; --primary-400:#579F99; --primary-200:#9FC8C5; --primary-08:#CFE4E2; --primary-04:#E7F1F1;
  --coral:#FF785A; --coral-700:#B8452D; --coral-08:#FFF2EF; --or:#FF622E; --or-700:#D93600; --or-800:#B52D00; --or-50:#FFF7ED;
  --ok:#0F766E; --ok-bg:#E7F1F1; --warn:#B52D00; --warn-line:#FF622E; --warn-bg:#FFF7ED; --bad:#B8452D; --bad-bg:#FFF2EF;
  --sea:#EEF2F2; --land:#FFFFFF; --nb:#F5F5F5; --nb-line:#E5E5E5;
  --d1:#E7F1F1; --d2:#CFE4E2; --d3:#9FC8C5; --d4:#579F99; --d5:#0F766E; --d6:#0C5E58;
  --ch1:var(--d1); --ch2:var(--d2); --ch3:var(--d3); --ch4:var(--d4); --ch5:var(--d5);
  --green:#0C5E58; --slate:#A3A3A3;
  --shadow:0 4px 8px #A3A3A31A;
  --f-body:"Vazirmatn",Tahoma,"Segoe UI",sans-serif;
}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--text)}
body{font-family:var(--f-body);font-size:14px;line-height:1.7;-webkit-font-smoothing:antialiased}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--primary-400);outline-offset:2px;border-radius:6px}
.num{font-variant-numeric:tabular-nums}
svg.i{width:20px;height:20px;flex:none;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
svg.i.s{width:16px;height:16px}

/* model switcher */
.switch{position:sticky;top:env(safe-area-inset-top,0px);z-index:1200;background:var(--surface);border-bottom:1px solid var(--line);
  padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:1300;background:var(--surface)}
.switch-in{display:flex;gap:16px;align-items:center;flex-wrap:wrap;max-width:1680px;margin-inline:auto}
.switch h1{font-size:15px;margin:0;font-weight:700;white-space:nowrap}
.switch h1 small{font-weight:400;color:var(--muted);font-size:12px;margin-inline-start:6px}
.tabs{display:flex;gap:4px;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:3px;overflow-x:auto;max-width:100%}
.tabs button{border:0;background:none;padding:6px 12px;border-radius:7px;font-size:13px;white-space:nowrap;color:var(--muted);min-height:34px}
.tabs button[aria-selected="true"]{background:var(--surface);color:var(--primary-700);font-weight:700;box-shadow:var(--shadow)}
.tabs button .new{font-size:10.5px;background:var(--coral-08);color:var(--coral-700);border-radius:20px;padding:0 6px;margin-inline-start:4px}
.brief{max-width:1680px;margin:10px auto 0;display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:6px 28px;font-size:13px;color:var(--muted)}
.brief b{color:var(--text)}
.brief a{color:var(--primary-700);text-decoration:none;border-bottom:1px dashed var(--primary-200)}
.brief p{margin:0}

/* shell */
.shell{display:grid;grid-template-columns:224px minmax(0,1fr);max-width:1680px;margin-inline:auto;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 72px}
.side{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px 12px;align-self:start;position:sticky;top:120px;margin-inline-end:16px}
.brand{display:flex;gap:10px;align-items:center;padding:0 6px 14px;border-bottom:1px solid var(--line);margin-bottom:10px}
.brand .logo{width:34px;height:34px;border-radius:9px;background:var(--primary);display:grid;place-items:center;color:#fff}
.brand b{display:block;font-size:15px} .brand small{color:var(--muted);font-size:11px}
.nav-g{font-size:11.5px;color:var(--faint);padding:10px 8px 4px}
.nav a{display:flex;align-items:center;gap:10px;padding:7px 8px;border-radius:8px;color:var(--text);text-decoration:none;font-size:13.5px;white-space:nowrap}
.nav a:hover{background:var(--surface-2)}
.nav a.on{background:var(--primary-04);color:var(--primary-700);font-weight:600}
.main{min-width:0;display:flex;flex-direction:column;gap:16px}

.hdr{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.hdr .hi{margin-inline-end:auto}
.hdr .hi b{font-size:20px;display:block;line-height:1.4}
.hdr .hi small{color:var(--muted);font-size:13px}
.icon-btn{width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;color:var(--muted);position:relative}
.icon-btn .dot{position:absolute;top:9px;inset-inline-end:10px;width:7px;height:7px;border-radius:50%;background:var(--coral)}
.me{display:flex;gap:8px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:4px 6px 4px 12px}
.av{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:700;background:var(--d1);color:var(--d5);flex:none;position:relative;border:2px solid var(--surface)}
.av.c2{background:var(--coral-08);color:var(--coral-700)} .av.c3{background:var(--warn-bg);color:var(--warn)} .av.c4{background:var(--surface-2);color:var(--muted)}
.av i{position:absolute;bottom:-2px;inset-inline-start:-2px;width:10px;height:10px;border-radius:50%;border:2px solid var(--surface);background:var(--faint)}
.av i.on{background:var(--ok)}
.me b{font-size:13px;display:block;line-height:1.3} .me small{font-size:11.5px;color:var(--muted)}

.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:20px;min-width:0}
.card-h{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.card-h h2{font-size:16px;margin:0;font-weight:700;text-wrap:balance}
.card-h .act{margin-inline-start:auto;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.lead{font-size:14.5px;margin:0 0 14px;color:var(--text);max-width:62ch}
.lead strong{font-weight:700}
.ic-badge{width:34px;height:34px;border-radius:9px;background:var(--surface-2);color:var(--text);display:grid;place-items:center;flex:none}
.ic-badge.c{background:var(--coral-08);color:var(--coral-700)}
.need{font-size:11.5px;color:var(--warn);background:var(--warn-bg);padding:1px 8px;border-radius:20px;white-space:nowrap}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.grid12{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:16px}
.s8{grid-column:span 8}.s4{grid-column:span 4}.s6{grid-column:span 6}.s12{grid-column:span 12}.s7{grid-column:span 7}.s5{grid-column:span 5}

.seg{display:inline-flex;background:var(--surface-2);border:1px solid var(--line);border-radius:9px;padding:2px;gap:2px;max-width:100%;overflow-x:auto}
.seg button{border:0;background:none;padding:5px 12px;border-radius:7px;font-size:13px;color:var(--muted);white-space:nowrap;min-height:32px}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--primary-700);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.1)}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line-2);background:var(--surface);border-radius:9px;padding:7px 12px;font-size:13px;white-space:nowrap;min-height:36px;color:var(--text)}
.btn:hover{background:var(--surface-2)}
.btn.pri{background:var(--primary);border-color:var(--primary);color:#fff;font-weight:600}
.btn.pri:hover{background:var(--primary-700)}
.btn.ghost{border-color:transparent;background:none;color:var(--primary-700);padding-inline:6px}
.btn.sm{min-height:32px;padding:3px 10px;font-size:12.5px}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line-2);background:var(--surface);border-radius:20px;padding:4px 12px;font-size:13px;white-space:nowrap;min-height:32px}
.chip .sw{width:10px;height:10px;border-radius:3px}
.chip[aria-pressed="false"]{color:var(--muted);background:var(--surface-2)}
.chip[aria-pressed="false"] .sw{background:var(--line-2)!important}
.chip[aria-pressed="true"]{border-color:var(--primary-200);background:var(--primary-04)}
.pill{font-size:12px;padding:1px 9px;border-radius:20px;white-space:nowrap;display:inline-flex;gap:4px;align-items:center}
.pill.ok{background:var(--ok-bg);color:var(--ok)} .pill.warn{background:var(--warn-bg);color:var(--warn)} .pill.bad{background:var(--bad-bg);color:var(--bad)} .pill.n{background:var(--surface-2);color:var(--muted)} .pill.p{background:var(--primary-04);color:var(--primary-700)}
.sel{display:flex;flex-direction:column;gap:3px;min-width:0}
.sel label{font-size:12px;color:var(--muted)}
.sel select{border:1px solid var(--line-2);background:var(--surface);border-radius:8px;padding:6px 8px;font-size:13px;min-width:0;width:100%;min-height:36px}
.sel select:disabled{opacity:.55}
.up{color:var(--ok)} .dn{color:var(--bad)}
.link{color:var(--primary-700);text-decoration:none;font-size:13px;display:inline-flex;align-items:center;gap:4px;background:none;border:0;padding:0;min-height:32px}

/* key numbers */
.keys{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.key{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:2px;min-width:0}
.key small{color:var(--muted);font-size:13px}
.key b{font-size:26px;line-height:1.35}
.key b span{font-size:14px;color:var(--muted);font-weight:500}
.key .d{font-size:12.5px;color:var(--muted)}
.meter{height:6px;background:var(--surface-2);border-radius:4px;overflow:hidden;margin-top:6px;display:flex}
.meter i{display:block;height:100%;background:var(--d4);border-radius:4px}

/* map */
.mapcard{padding:0;overflow:hidden;position:relative}
.mapwrap{position:relative;height:640px;background:var(--sea)}
.mapwrap .lmap{position:absolute;inset:0;background:var(--sea)}
.leaflet-container{font-family:var(--f-body)!important;background:var(--sea)!important}
.ov{position:absolute;z-index:500;direction:rtl}
.glass{background:rgba(255,255,255,.97);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow)}
.m-top{top:12px;right:12px;display:flex;flex-direction:column;gap:8px;width:340px;max-width:calc(100% - 76px)}
.m-search{display:flex;align-items:center;gap:6px;padding:4px 4px 4px 4px;position:relative}
.m-search > svg{margin-inline-start:8px;color:var(--faint)}
.m-search input{flex:1;min-width:0;border:0;background:none;outline:none;padding:8px 4px;font-size:14px}
.fbtn{display:inline-flex;align-items:center;gap:6px;border:0;background:var(--surface-2);border-radius:8px;padding:6px 10px;font-size:13px;min-height:36px}
.fbtn[aria-expanded="true"]{background:var(--primary-04);color:var(--primary-700)}
.fbtn b{background:var(--primary);color:#fff;border-radius:20px;font-size:11px;padding:0 6px;line-height:1.6}
.m-results{position:absolute;top:calc(100% + 6px);right:0;left:0;padding:4px;max-height:280px;overflow:auto;z-index:2}
.m-results button{display:flex;width:100%;gap:8px;align-items:center;border:0;background:none;padding:8px 10px;border-radius:8px;text-align:start;font-size:13.5px}
.m-results button:hover,.m-results button:focus{background:var(--surface-2)}
.m-results small{color:var(--muted);font-size:12px;margin-inline-start:auto}
.m-crumb{display:flex;align-items:center;gap:2px;flex-wrap:wrap;font-size:12.5px}
.m-crumb button{border:0;background:rgba(255,255,255,.9);padding:2px 8px;border-radius:7px;color:var(--muted);font-size:12.5px;min-height:28px}
.m-crumb button:hover{color:var(--text)}
.m-crumb button[aria-current="true"]{color:var(--text);font-weight:700;background:var(--surface)}
.m-crumb .sep{color:var(--faint);padding-inline:2px}
.m-fpop{padding:14px;display:flex;flex-direction:column;gap:12px}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.fsec{display:flex;flex-direction:column;gap:6px}
.fsec > span{font-size:12px;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.m-levels{display:flex;gap:2px;padding:3px;bottom:12px;left:50%;transform:translateX(-50%)}
.m-levels button{border:0;background:none;border-radius:8px;padding:5px 10px;font-size:12.5px;color:var(--muted);display:flex;align-items:center;gap:6px;min-height:34px}
.m-levels button .d{width:8px;height:8px;border-radius:50%;background:var(--line-2)}
.m-levels button[aria-current="true"]{background:var(--primary);color:#fff;font-weight:600}
.m-levels button[aria-current="true"] .d{background:#fff}
.m-levels button.past .d{background:var(--primary-400)}
.m-zoom{left:12px;top:12px;display:flex;flex-direction:column;overflow:hidden}
.m-zoom button{width:40px;height:40px;border:0;background:none;display:grid;place-items:center;color:var(--text);border-bottom:1px solid var(--line)}
.m-zoom button:last-child{border-bottom:0}
.m-zoom button:hover{background:var(--surface-2)}
.m-legend{left:12px;bottom:12px;padding:10px 12px;font-size:12.5px;max-width:240px}
.m-legend b{font-size:12.5px;display:block;margin-bottom:4px}
.lg-scale{display:flex;gap:2px;align-items:center}
.lg-scale i{width:24px;height:10px;border-radius:2px;display:block}
.lg-row{display:flex;gap:8px;align-items:center;margin-top:3px;color:var(--muted)}
.lg-sw{width:13px;height:13px;border-radius:3px;flex:none}
.lg-hatch{background:repeating-linear-gradient(45deg,#F0F2F5 0 3px,#B4BCC6 3px 4px);border:1px solid var(--line-2)}
.lg-ln{width:16px;height:0;border-top:3px solid;flex:none}
.lg-dt{width:11px;height:11px;border-radius:50%;flex:none;border:2px solid var(--surface)}
.m-cta{right:12px;bottom:12px;display:flex;flex-direction:column;align-items:flex-end;gap:8px}
.cta-box{display:flex;flex-direction:column;align-items:flex-end;padding:6px;gap:2px;border-radius:14px}
.cta-box .row{display:flex;gap:6px;align-items:center}
.cta{display:inline-flex;align-items:center;gap:8px;background:var(--primary);color:#fff;border:0;border-radius:11px;padding:10px 16px;font-weight:700;font-size:14px;min-height:44px}
.cta:hover{background:var(--primary-700)}
.cta-more{width:44px;height:44px;border-radius:11px;border:1px solid var(--line-2);background:var(--surface);display:grid;place-items:center}
.cta-menu{padding:6px;min-width:260px;position:absolute;bottom:72px;right:0}
.cta-menu button{display:flex;gap:10px;align-items:center;width:100%;border:0;background:none;text-align:start;padding:8px 10px;border-radius:8px;font-size:13.5px}
.cta-menu button:hover{background:var(--surface-2)}
.cta-menu button small{display:block;color:var(--muted);font-size:12px;line-height:1.5}
.cta-menu .h{font-size:12px;color:var(--faint);padding:4px 10px}
.cta-ctx{font-size:12px;color:var(--muted);padding:2px 10px}
.m-hover{pointer-events:none;padding:8px 12px;font-size:12.5px;min-width:170px;display:none}
.m-hover b{display:block;font-size:13px}
.r{display:flex;justify-content:space-between;gap:16px;color:var(--muted)}
.r span:last-child{color:var(--text);font-weight:600}
.m-area{top:122px;right:12px;width:320px;padding:16px;max-height:calc(100% - 210px);overflow:auto}
.m-area h3{margin:0;font-size:17px}
.m-area .meta{font-size:12.5px;color:var(--muted);margin-bottom:6px}
.nums{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:10px 0}
.nums div{background:var(--surface-2);border-radius:10px;padding:8px 10px;min-width:0}
.nums small{display:block;color:var(--muted);font-size:12px}
.nums b{font-size:18px}
.acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
.mini-list{display:flex;flex-direction:column;margin-top:6px}
.mini-list button{display:flex;gap:8px;align-items:center;border:0;border-bottom:1px solid var(--line);background:none;padding:7px 2px;text-align:start;font-size:13px;min-height:36px}
.mini-list button:last-child{border-bottom:0}
.mini-list button:hover{color:var(--primary-700)}
.mini-list button .v{margin-inline-start:auto;color:var(--muted);font-size:12.5px}
.stage-dots{display:flex;gap:4px;margin:6px 0 2px}
.stage-dots i{flex:1;height:6px;border-radius:3px;background:var(--surface-2)}
.stage-dots i.on{background:var(--d4)}
.m-card{top:64px;left:62px;width:290px;padding:14px;max-height:calc(100% - 140px);overflow:auto;z-index:600}
.m-card h4{margin:0 0 2px;font-size:15px;padding-inline-end:28px}
.m-card .meta{font-size:12.5px;color:var(--muted);margin-bottom:8px}
.kv{display:grid;grid-template-columns:1fr auto;gap:4px 12px;font-size:13px;margin:8px 0}
.kv span:nth-child(odd){color:var(--muted)}
.kv span:nth-child(even){font-weight:600;text-align:left}
.xbtn{position:absolute;top:8px;left:8px;border:0;background:none;color:var(--muted);width:32px;height:32px;display:grid;place-items:center;border-radius:8px}
.xbtn:hover{background:var(--surface-2)}
.m-draw{top:12px;left:50%;transform:translateX(-50%);padding:10px 14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;width:max-content;max-width:calc(100% - 120px);font-size:13px;z-index:650}
.m-draw b{color:var(--primary-700)}
.m-toast{bottom:76px;left:50%;transform:translateX(-50%);padding:10px 14px;font-size:13px;width:max-content;max-width:min(520px,calc(100% - 24px));display:flex;gap:10px;align-items:flex-start;z-index:650}
.drawing .leaflet-container{cursor:crosshair!important}
.lbl{background:none!important;border:0!important;box-shadow:none!important;padding:0!important;font-family:var(--f-body);font-size:12px;font-weight:600;color:var(--text);
  text-shadow:0 0 3px #fff,0 0 3px #fff,0 0 3px #fff;white-space:nowrap}
.lbl::before{display:none}
.lbl.st{font-size:11px;font-weight:500;color:var(--muted)} .lbl.ex{color:var(--coral-700);font-size:11.5px}
.pin{display:inline-flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--line-2);border-radius:20px;padding:2px 9px 2px 4px;font-family:var(--f-body);font-size:12.5px;
  box-shadow:0 2px 6px rgba(0,0,0,.15);white-space:nowrap;transform:translate(-50%,-50%);position:absolute;direction:rtl;color:var(--text);cursor:pointer}
.pin b{font-weight:700}
.pin span{background:var(--d5);color:#fff;border-radius:20px;padding:0 7px;font-size:11.5px}
.pin:hover{border-color:var(--d4)}
.ppin{position:absolute;transform:translate(-50%,-100%);display:flex;flex-direction:column;align-items:center;font-family:var(--f-body);cursor:pointer}
.ppin div{background:var(--coral-700);color:#fff;border-radius:8px;padding:1px 7px;font-size:11.5px;font-weight:700;white-space:nowrap;box-shadow:0 2px 6px rgba(0,0,0,.2)}
.ppin i{width:0;height:0;border:5px solid transparent;border-top-color:var(--coral-700)}
.ppin.late div{background:var(--bad)} .ppin.late i{border-top-color:var(--bad)}
.tpin{position:absolute;transform:translate(-50%,-50%);width:32px;height:32px;border-radius:50%;background:var(--coral-700);color:#fff;display:grid;place-items:center;font-weight:700;font-family:var(--f-body);
  box-shadow:0 0 0 6px rgba(184,69,45,.22),0 2px 6px rgba(0,0,0,.25);cursor:pointer;font-size:14px}
.vx{width:12px;height:12px;border-radius:50%;background:var(--surface);border:2.5px solid var(--coral-700);transform:translate(-50%,-50%);position:absolute}

/* list (model 2) */
.split{display:grid;grid-template-columns:360px minmax(0,1fr);height:640px}
.list{border-inline-end:1px solid var(--line);display:flex;flex-direction:column;min-height:0;background:var(--surface)}
.list-h{padding:14px 16px;border-bottom:1px solid var(--line)}
.list-h b{font-size:15px;display:block}
.list-h small{color:var(--muted);font-size:12.5px}
.list-b{overflow:auto;flex:1;min-height:0}
.li{display:flex;gap:12px;align-items:center;padding:10px 16px;border-bottom:1px solid var(--line);cursor:pointer;width:100%;background:none;border-inline:0;border-top:0;text-align:start}
.li:hover,.li:focus{background:var(--surface-2)}
.li .m{flex:1;min-width:0}
.li .m b{display:block;font-size:13.5px;font-weight:600}
.li .m small{color:var(--muted);font-size:12.5px}
.li .n{font-weight:700;font-size:13.5px}
.bar{height:6px;background:var(--surface-2);border-radius:4px;overflow:hidden;margin-top:4px;position:relative}
.bar i{display:block;height:100%;border-radius:4px;background:var(--d4)}
.list-f{padding:10px 16px;border-top:1px solid var(--line);display:flex;gap:8px}

/* layers (model 3) */
.lp{top:122px;right:12px;width:250px;padding:12px;max-height:calc(100% - 240px);overflow:auto}
.lp h3{font-size:12.5px;margin:4px 0 6px;color:var(--muted);font-weight:500}
.lrow{display:flex;align-items:center;gap:8px;padding:6px;border-radius:8px;font-size:13.5px;width:100%;border:0;background:none;text-align:start;min-height:36px}
.lrow:hover{background:var(--surface-2)}
.lrow .nm{flex:1;min-width:0}
.lrow .cnt{font-size:12.5px;color:var(--muted)}
.lrow[aria-current="true"]{background:var(--surface-2);font-weight:700;color:var(--text);box-shadow:inset -3px 0 0 var(--primary)}
.sw-tg{position:relative;width:34px;height:20px;border-radius:20px;background:var(--line-2);flex:none;transition:background .15s}
.sw-tg::after{content:"";position:absolute;top:2px;right:2px;width:16px;height:16px;border-radius:50%;background:#fff;transition:right .15s;box-shadow:0 1px 2px rgba(0,0,0,.2)}
[aria-pressed="true"] > .sw-tg{background:var(--primary)}
[aria-pressed="true"] > .sw-tg::after{right:16px}
.timebar{left:12px;right:12px;bottom:62px;padding:10px 14px;display:flex;gap:12px;align-items:center;margin-inline:auto;max-width:600px}
.timebar input{flex:1;accent-color:var(--primary);min-width:0}
.timebar .t{font-size:13px;white-space:nowrap;min-width:130px}
.histo{display:flex;align-items:flex-end;gap:2px;height:24px;min-width:0;direction:ltr}
.histo i{flex:1;background:var(--d2);border-radius:2px 2px 0 0}
.histo i.on{background:var(--d4)}

/* ask bar (model 5) */
.askbar{top:14px;left:50%;transform:translateX(-50%);width:min(620px,calc(100% - 140px));padding:6px;display:flex;flex-direction:column;gap:6px}
.askbar .in{display:flex;align-items:center;gap:8px;padding:2px 8px}
.askbar input{flex:1;border:0;background:none;outline:none;padding:9px 0;min-width:0;font-size:15px}
.askbar .sugs{display:flex;gap:6px;overflow-x:auto;padding:0 6px 4px}
.ans{top:128px;left:62px;width:330px;padding:16px;max-height:calc(100% - 210px);overflow:auto}
.ans .q{font-size:12.5px;color:var(--muted);display:flex;gap:6px;align-items:center}
.ans p{margin:6px 0 10px;font-size:14px}

/* assistant */
.ai{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:24px;align-items:center;background:var(--surface);border-color:var(--line)}
.ai h2{font-size:18px;margin:6px 0 4px}
.ai p{margin:0;color:var(--muted);font-size:13.5px;max-width:52ch}
.ai-in{display:flex;gap:8px;background:var(--surface);border:1px solid var(--line-2);border-radius:12px;padding:6px;align-items:center}
.ai-in:focus-within{border-color:var(--primary)}
.ai-in > svg{margin-inline-start:6px;color:var(--faint)}
.ai-in input{flex:1;border:0;outline:none;background:none;padding:6px 4px;min-width:0}
.ai-sug{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.ai-sug button{border:1px solid var(--line-2);background:var(--surface);border-radius:20px;padding:5px 12px;font-size:12.5px;min-height:32px;text-align:start}
.ai-sug button:hover{border-color:var(--primary-400)}
.ai-ans{margin-top:10px;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:13.5px}
.sparkle{width:36px;height:36px;border-radius:10px;background:var(--coral-08);color:var(--coral-700);display:grid;place-items:center;flex:none}
.caps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.cap{border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:6px;background:var(--surface);text-align:start}
.cap b{font-size:14px} .cap p{margin:0;color:var(--muted);font-size:13px}
.cap .eg{font-size:12.5px;color:var(--text);background:var(--surface-2);border-radius:8px;padding:6px 9px;border:0;text-align:start}
.fab{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:max(20px,env(safe-area-inset-left,0px));z-index:1100;display:inline-flex;gap:8px;align-items:center;background:var(--primary-700);color:#fff;border:0;border-radius:24px;padding:10px 16px;font-weight:600;box-shadow:var(--shadow);min-height:44px;opacity:0;transform:translateY(12px);pointer-events:none;transition:opacity .2s,transform .2s}
.fab.show{opacity:1;transform:none;pointer-events:auto}
@media (prefers-reduced-motion:reduce){.fab{transition:none}}

/* team */
.stack{display:flex;align-items:center}
.stack .av{margin-inline-start:-8px}
.stack .av:first-child{margin-inline-start:0}
.stack .more{font-size:12.5px;color:var(--muted);margin-inline-start:8px}
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;height:104px;margin:6px 0 2px}
.week div{display:flex;flex-direction:column;align-items:center;gap:3px;height:100%;justify-content:flex-end}
.week i{width:100%;max-width:30px;background:var(--d2);border-radius:5px 5px 2px 2px;display:block}
.week .today i{background:var(--d5)}
.week .off i{background:repeating-linear-gradient(45deg,var(--surface-2) 0 3px,var(--line-2) 3px 4px);min-height:6px}
.week span{font-size:11.5px;color:var(--muted)}
.week em{font-style:normal;font-size:11.5px;font-weight:600}
.feed{display:flex;flex-direction:column}
.fi{display:flex;gap:12px;padding:9px 0;border-bottom:1px solid var(--line);align-items:flex-start}
.fi:last-child{border-bottom:0}
.fi .m{flex:1;min-width:0;font-size:13.5px}
.fi .m b{font-weight:600}
.fi .m small{display:block;color:var(--muted);font-size:12.5px}
.fi time{font-size:12px;color:var(--faint);white-space:nowrap}

/* partners */
.pp{display:grid;grid-template-columns:minmax(0,1fr) 48px;gap:4px 12px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}
.pp-list .pp:last-child{border-bottom:0}
.pp .top{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.pp .top b{font-size:14px;font-weight:600}
.pp .top small{color:var(--muted);font-size:12px}
.pp .pc{font-weight:700;text-align:left;font-size:15px}
.pbar{grid-column:1 / -1;height:10px;background:var(--surface-2);border-radius:5px;position:relative}
.pbar i{position:absolute;inset-block:0;right:0;border-radius:5px}
.pbar u{position:absolute;top:-4px;bottom:-4px;width:3px;background:var(--text);border-radius:2px}
.pp-leg{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:10px}
.pp-leg span{display:inline-flex;gap:6px;align-items:center}

/* pipeline */
.pipe{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px;align-items:end}
.step{display:flex;flex-direction:column;gap:4px;border:0;background:none;padding:8px;border-radius:10px;text-align:start;min-width:0}
.step:hover{background:var(--surface-2)}
.step[aria-pressed="true"]{background:var(--surface-2);box-shadow:inset 0 0 0 2px var(--d4)}
.step .col{height:110px;display:flex;flex-direction:column;justify-content:flex-end}
.step .col i{width:100%;display:block}
.step .col .stay{background:var(--coral);border-radius:6px 6px 0 0;opacity:.85}
.step .col .pass{background:var(--d2)}
.step .col .done{background:var(--primary);border-radius:6px 6px 3px 3px}
.step b{font-size:18px;line-height:1.3}
.step small{font-size:12px;color:var(--muted);line-height:1.5}
.step .no{font-size:11.5px;color:var(--faint)}
.drop{display:flex;gap:8px;align-items:center;margin-top:12px;font-size:13.5px;padding:10px 12px;background:var(--warn-bg);border-radius:10px;color:var(--warn)}

/* tasks */
.tasks{display:flex;flex-direction:column;gap:10px}
.task{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;border:1px solid var(--line);border-radius:12px;padding:12px 14px;background:var(--surface)}
.task .n{width:30px;height:30px;border-radius:50%;background:var(--coral-08);color:var(--coral-700);display:grid;place-items:center;font-weight:700}
.task b{font-size:14px;display:block;line-height:1.6}
.task small{color:var(--muted);font-size:12.5px}
.task .acts{display:flex;gap:6px;margin:0}
.tasks.big{display:grid;grid-template-columns:repeat(3,minmax(0,1fr))}
.tasks.big .task{grid-template-columns:auto minmax(0,1fr);align-content:start;padding:16px}
.tasks.big .task .acts{grid-column:1/-1}

/* trend */
.trend-tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.trend-tools .sp{margin-inline-start:auto}
.tgl{display:inline-flex;gap:7px;align-items:center;font-size:13px;color:var(--muted);cursor:pointer;user-select:none;min-height:32px}
.tgl input{accent-color:var(--primary);width:16px;height:16px}
.tchart{position:relative;min-width:0}
.chart{width:100%;display:block;overflow:visible}
.chart text{fill:var(--muted);font-family:var(--f-body);font-size:11.5px}
.ttip{position:absolute;pointer-events:none;padding:8px 10px;font-size:12.5px;min-width:160px;display:none;z-index:5}
.ttip b{display:block;font-size:13px;margin-bottom:2px}
.tleg{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);margin-bottom:6px}
.tleg span{display:inline-flex;gap:6px;align-items:center}

/* monitoring (model 4) */
.live{display:inline-flex;gap:6px;align-items:center;font-size:12.5px;color:var(--muted)}
.live i{width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 3px var(--ok-bg)}
.alerts{display:flex;flex-direction:column;gap:8px}
.al{display:flex;gap:10px;padding:10px 12px;border-radius:10px;border:1px solid var(--line);align-items:flex-start;background:var(--surface)}
.al .ic{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;flex:none}
.al.bad .ic{background:var(--bad-bg);color:var(--bad)} .al.warn .ic{background:var(--warn-bg);color:var(--warn)} .al.info .ic{background:var(--d1);color:var(--d5)}
.al .m{flex:1;min-width:0;font-size:13.5px}
.al .m b{display:block;font-weight:600}
.al .m small{color:var(--muted);font-size:12.5px}

.sec-title{display:flex;align-items:baseline;gap:10px;margin:8px 0 -4px;flex-wrap:wrap}
.sec-title h2{font-size:18px;margin:0}
.sec-title span{color:var(--muted);font-size:13px}
.src{font-size:12px;color:var(--faint);margin-top:10px}

@media (max-width:1180px){
  .shell{grid-template-columns:minmax(0,1fr)} .side{display:none}
  .grid12 > *{grid-column:span 12}
  .brief{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:860px){
  .keys,.grid2,.grid3,.ai,.caps,.tasks.big{grid-template-columns:minmax(0,1fr)}
  .split{grid-template-columns:minmax(0,1fr);height:auto} .split .list{max-height:300px;border-inline-end:0;border-bottom:1px solid var(--line)}
  .split .mapwrap{height:540px!important}
  .mapwrap{height:580px!important}
  .m-area,.lp{top:auto;bottom:64px;right:12px;left:12px;width:auto;max-height:40%}
  .m-levels button span{display:none}
  .askbar{width:calc(100% - 76px);left:auto;right:12px;transform:none}
  .ans{left:12px;right:12px;width:auto;top:auto;bottom:64px}
  .pipe{grid-template-columns:repeat(3,minmax(0,1fr))}
  .m-legend{display:none}
  .timebar{bottom:120px}
}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
[hidden]{display:none!important}
.mapcard{container-type:inline-size}
@container (max-width:980px){ .m-levels{bottom:auto;top:12px;left:58px;transform:none} }
.askbar .chips,.ai-sug{flex-wrap:wrap}

/* ===== v3: per-model section patterns ===== */
.dn{color:var(--coral-700)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.big{font-size:22px;font-weight:700;line-height:1.2}
.big span{font-size:13px;font-weight:400;color:var(--muted)}
.chart{display:block;width:100%;height:auto;overflow:visible}
.chart .ax{font-size:11px;fill:var(--faint);font-family:var(--f-body)}
.chart .lb{font-size:12.5px;fill:var(--text);font-weight:600;font-family:var(--f-body)}
.chart .lb2{font-size:11px;fill:var(--muted);font-family:var(--f-body)}
.chart .gp{font-size:11.5px;font-weight:700;font-family:var(--f-body)}
.chart .nowt{font-size:10.5px;fill:#fff;font-weight:700;font-family:var(--f-body)}
.ring .rt{font-size:12px;font-weight:700;fill:var(--text);font-family:var(--f-body)}
.spk{display:block;flex:none}
.dot{width:11px;height:11px;border-radius:50%;display:inline-block;flex:none}
.dot.hollow{background:var(--surface);border:2px solid var(--text)}
.empty{display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;padding:22px 12px;color:var(--muted);font-size:13px}
.empty b{color:var(--text);font-size:14px}
.empty p{margin:0 0 4px;max-width:30ch}
.empty > svg{width:28px;height:28px;color:var(--faint)}

/* model 1: map-only with side sheet */
.mapcard.tall .mapwrap{min-height:600px}
.m-sheet{padding:0;width:360px;top:108px;max-height:calc(100% - 224px);display:flex;flex-direction:column;overflow:hidden}
.sh-tabs{display:flex;border-bottom:1px solid var(--line);padding:0 8px;flex:none}
.sh-tabs button{flex:1;border:0;background:none;padding:12px 6px 10px;font-size:13.5px;color:var(--muted);border-bottom:2.5px solid transparent;min-height:44px}
.sh-tabs button[aria-selected="true"]{color:var(--text);font-weight:700;border-bottom-color:var(--primary)}
.sh-body{padding:14px 16px 16px;overflow:auto;min-height:0}
.sh-meta{font-size:12.5px;color:var(--muted);margin-bottom:10px}
.pt{margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}
.pt-h b{display:block;font-size:13.5px}.pt-h small{color:var(--muted);font-size:12px}
.pt-bars{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;align-items:end;height:84px;margin:10px 0 4px}
.pt-bars > div{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:4px}
.pt-bars i{display:block;width:100%;background:var(--d2);border-radius:4px 4px 2px 2px;position:relative}
.pt-bars .td i{background:var(--d3)}
.pt-bars u{position:absolute;bottom:0;left:18%;right:18%;background:var(--coral);border-radius:3px 3px 0 0;opacity:.9}
.pt-bars span{font-size:11.5px;color:var(--muted)}
.pt-bars .td span{color:var(--text);font-weight:700}
.pt-n{font-size:12.5px;margin:6px 0 0;color:var(--muted)}
.pt-n b{color:var(--text)}
.live-dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--coral);margin-inline-end:6px;box-shadow:0 0 0 3px var(--coral-08)}
.pcards{display:flex;flex-direction:column;gap:10px}
.pcard{display:grid;grid-template-columns:56px minmax(0,1fr) auto;gap:6px 12px;align-items:center;border:1px solid var(--line);border-radius:12px;padding:10px}
.pcard .thumb{width:56px;height:56px;border-radius:9px;background:repeating-linear-gradient(135deg,var(--d1) 0 6px,#fff 6px 12px);display:grid;place-items:center;color:var(--d4)}
.pcard .m{min-width:0;display:flex;flex-direction:column;align-items:flex-start;gap:2px}
.pcard .m b{font-size:14px}.pcard .m small{color:var(--muted);font-size:12px}
.pcard .btn{grid-column:1 / -1;justify-content:center}
.hint{font-size:12px;color:var(--muted);margin:10px 0 0;display:flex;gap:6px;align-items:center}
.hint .tk{width:2.5px;height:12px;background:var(--text);border-radius:2px;display:inline-block}
.revs{display:flex;flex-direction:column}
.rev{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.rev:last-child{border-bottom:0}
.rev .m{min-width:0;font-size:13px}.rev .m b{display:block}.rev .m small{color:var(--muted);font-size:12px}
.rev p{margin:4px 0 2px;background:var(--surface-2);border-radius:8px;padding:6px 9px}
.rev time{font-size:11.5px;color:var(--faint)}
.av i.on{position:absolute;bottom:-1px;left:-1px;width:9px;height:9px;border-radius:50%;background:var(--ok);border:2px solid #fff}
.askmode{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--line-2);background:var(--surface);border-radius:20px;padding:3px 10px;font-size:12.5px;min-height:32px;color:var(--muted);flex:none}
.askmode[aria-pressed="true"]{background:var(--coral-08);border-color:var(--coral);color:var(--coral-700);font-weight:600}
.m-search.asking{box-shadow:0 0 0 2px var(--coral),var(--shadow)}
.ans-h{display:flex;gap:6px;align-items:center;font-weight:700;color:var(--coral-700);font-size:13px}
.m-card .q{color:var(--muted);font-size:12.5px;margin:6px 0 2px}

/* model 2 */
.nlf{padding:14px 16px}
.nlf-in{display:flex;gap:10px;align-items:center;border:1.5px solid var(--line-2);border-radius:12px;padding:5px 5px 5px 5px;background:var(--surface)}
.nlf-in:focus-within{border-color:var(--coral)}
.nlf-in .sparkle{width:32px;height:32px}
.nlf-in input{flex:1;min-width:0;border:0;outline:none;background:none;font-size:15px;padding:8px 0}
.nlf-row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:10px}
.nlf-sug{display:flex;gap:6px;flex-wrap:wrap}
.nlf-tok{display:flex;gap:6px;flex-wrap:wrap;align-items:center;width:100%}
.nlf-tok:empty{display:none}
.nlf-tok .say{display:inline-flex;gap:6px;align-items:center;font-size:13.5px;margin-inline-end:6px}
.nlf-tok .say svg{color:var(--coral-700)}
.tok{font-size:12.5px;background:var(--d1);color:var(--d5);border-radius:20px;padding:2px 10px;border:1px solid var(--d2)}
.tbl-w{overflow-x:auto;margin:0 -4px}
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{font-weight:500;color:var(--muted);font-size:12px;text-align:start;padding:6px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:7px 6px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl td.t{color:var(--faint);font-size:12px;white-space:nowrap}
.tbl .rk{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--surface-2);font-size:12px;font-weight:700}
.tbl tr:first-child .rk{background:var(--d5);color:#fff}
.who{display:flex;gap:8px;align-items:center;min-width:150px}
.who b{display:block;font-size:13px}.who small{color:var(--muted);font-size:11.5px}
.sort{border:0;background:none;padding:0;color:inherit;font:inherit;min-height:28px;display:inline-flex;align-items:center;gap:4px;text-decoration:underline dotted;text-underline-offset:3px}
.sort[aria-pressed="true"]{color:var(--text);font-weight:700;text-decoration:none}
.sort[aria-pressed="true"]::after{content:"▼";font-size:9px}
.smg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.sm{border:1px solid var(--line);border-radius:12px;padding:12px}
.sm-h{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;margin-bottom:6px}
.sm-h b{font-size:13.5px}.sm-h .big{margin-inline-start:auto}
.sm-h .d{font-size:12px;width:100%;text-align:end}
.sm-f{display:flex;justify-content:space-between;font-size:11px;color:var(--faint);flex-direction:row-reverse}

/* model 3 */
.lvl-dots{display:flex;gap:2px;background:var(--surface-2);border-radius:9px;padding:2px}
.lvl-dots button{flex:1;border:0;background:none;font-size:11.5px;padding:5px 2px;border-radius:7px;color:var(--muted);min-height:30px}
.lvl-dots button.past{color:var(--text)}
.lvl-dots button.on{background:var(--surface);color:var(--text);font-weight:700;box-shadow:0 1px 2px rgba(0,0,0,.1)}
.lrow2{display:flex;align-items:center;gap:2px}
.lrow2 .lrow{flex:1}
.why{width:32px;height:32px;border-radius:8px;border:0;background:none;color:var(--faint);display:grid;place-items:center;flex:none}
.why:hover,.why[aria-expanded="true"]{background:var(--coral-08);color:var(--coral-700)}
.why-a{margin:0 6px 6px;font-size:12.5px;background:var(--coral-08);color:var(--coral-700);border-radius:8px;padding:7px 9px}
.cal-w{overflow-x:auto}
.cal-w .chart{min-width:760px}
.cal-leg{display:flex;align-items:center;gap:4px;font-size:12px;color:var(--muted);margin-top:8px;justify-content:flex-end}
.cal-leg i{width:12px;height:12px;border-radius:3px;display:inline-block;border:1px solid var(--line)}
.cal-leg .sep{width:12px}
.gantt-w{overflow-x:auto}.gantt-w .chart{min-width:560px}

/* model 4 */
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;border-top:3px solid var(--d3)}
.tile.bad{border-top-color:var(--coral-700)}.tile.warn{border-top-color:var(--warn-line)}.tile.ok{border-top-color:var(--d4)}
.tile small{color:var(--muted);font-size:12.5px}
.tv{display:flex;align-items:flex-end;justify-content:space-between;gap:8px;margin:2px 0 4px}
.tv b{font-size:28px;line-height:1.1}
.tile .st{font-size:12px;display:flex;gap:6px;align-items:center;color:var(--muted)}
.tile .st i{width:8px;height:8px;border-radius:50%;background:var(--d4)}
.tile.bad .st i{background:var(--coral-700)}.tile.warn .st i{background:var(--warn-line)}
.ins{display:flex;flex-direction:column;gap:10px}
.insc{border:1px solid var(--line);border-radius:12px;padding:12px;border-inline-start:4px solid var(--d3)}
.insc.bad{border-inline-start-color:var(--coral-700)}.insc.ok{border-inline-start-color:var(--primary)}.insc.warn{border-inline-start-color:var(--warn-line)}
.insc .t{display:flex;gap:8px;align-items:flex-start;font-size:14px}
.insc .ic{width:26px;height:26px;border-radius:7px;display:grid;place-items:center;background:var(--surface-2);flex:none}
.insc ul{margin:8px 0 0;padding-inline-start:18px;font-size:13px;color:var(--muted)}
.insc .acts{display:flex;gap:6px;align-items:center;margin-top:10px;flex-wrap:wrap}
.insc .acts .link{margin-inline-start:auto;color:var(--muted)}
.allclear{display:flex;flex-direction:column;align-items:center;gap:4px;padding:24px;color:var(--muted);text-align:center}
.allclear svg{color:var(--primary);width:28px;height:28px}.allclear b{color:var(--text)}
.wl{display:flex;flex-direction:column;gap:8px;position:relative}
.wr{display:grid;grid-template-columns:150px minmax(0,1fr) 28px;gap:10px;align-items:center}
.wn{display:flex;gap:6px;align-items:center;font-size:13px;min-width:0;flex-wrap:wrap}
.wn b{font-weight:500}
.wr.over .wn b{color:var(--coral-700);font-weight:700}
.sd{width:8px;height:8px;border-radius:50%;background:var(--line-2);flex:none}.sd.on{background:var(--ok)}
.wb{height:14px;background:var(--surface-2);border-radius:4px;display:flex;position:relative}
.wb i{display:block;height:100%}
.wb i:first-child{border-radius:0 4px 4px 0}
.wb::after{content:"";position:absolute;top:-4px;bottom:-4px;right:var(--cap);width:2px;background:var(--coral-700)}
.wv{font-size:13px;font-weight:700;text-align:end}
.htiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px}
.ht{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:start;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:12px;min-height:44px}
.ht:hover{border-color:var(--line-2);background:var(--surface-2)}
.ht b{font-size:14px}.ht small{color:var(--muted);font-size:12px}
.hs{display:inline-flex;gap:6px;align-items:center;font-size:12px;font-weight:600}
.hs i{width:9px;height:9px;border-radius:50%}
.ht.ok .hs{color:var(--primary-700)}.ht.ok .hs i{background:var(--primary)}
.ht.warn .hs{color:var(--warn)}.ht.warn .hs i{background:var(--warn-line)}
.ht.bad .hs{color:var(--coral-700)}.ht.bad .hs i{background:var(--coral-700)}
.ht.bad{background:var(--coral-08);border-color:var(--coral-08)}
.hv{font-size:20px;font-weight:700;margin-top:6px}

/* ===================== v4 · Figma palette, distinct shells ===================== */
.card{box-shadow:var(--shadow)}
.ec{width:100%;min-width:0;direction:ltr}
.ec-fail{color:var(--muted);font-size:13px;text-align:center;padding:24px 8px;margin:0}
.eyebrow{font-size:12px;color:var(--faint);margin:0 0 2px;letter-spacing:0}
.or{color:var(--or-800)}
.pill.ok{background:var(--primary-04);color:var(--primary-700)}
.sparkle{color:var(--primary)}
.btn.pri{background:var(--primary);border-color:var(--primary);color:#fff}
.btn.wide{width:100%;justify-content:center}
.tabs button[aria-selected="true"]{color:var(--primary-700)}
.ai-chips{display:flex;flex-wrap:wrap;gap:6px}
.ai-chips button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:12.5px;color:var(--text);min-height:32px;text-align:right}
.ai-chips button:hover{border-color:var(--primary-200);background:var(--primary-04)}
.mapcard.bare{border:0;box-shadow:none;border-radius:inherit;height:100%}
.mapcard.bare .mapwrap{border-radius:inherit}

/* ---------- shells ---------- */
body[data-shell="rail"] .shell{grid-template-columns:68px minmax(0,1fr)}
body[data-shell="rail"] .side{padding:12px 8px;margin-inline-end:12px;border-radius:14px}
body[data-shell="rail"] .brand{padding:0 0 10px;justify-content:center}
body[data-shell="rail"] .brand div,body[data-shell="rail"] .nav-g{display:none}
body[data-shell="rail"] .nav a{font-size:0;justify-content:center;padding:9px 0;gap:0}
body[data-shell="rail"] .nav a svg{width:20px;height:20px}
body[data-shell="rail"] .nav{display:flex;flex-direction:column;gap:2px}
body[data-shell="top"] .shell{grid-template-columns:minmax(0,1fr)}
body[data-shell="top"] .side{position:static;display:flex;align-items:center;gap:14px;margin:0 0 16px;padding:8px 12px;border-radius:12px;overflow:hidden}
body[data-shell="top"] .brand{border:0;margin:0;padding:0;flex:none}
body[data-shell="top"] .brand small{display:none}
body[data-shell="top"] .nav{display:flex;gap:2px;overflow-x:auto;min-width:0}
body[data-shell="top"] .nav-g{display:none}
body[data-shell="top"] .nav a{padding:6px 10px}
body[data-shell="none"] .shell{grid-template-columns:minmax(0,1fr)}
body[data-shell="none"] .side{display:none}

/* ---------- M1 full-bleed ---------- */
.m1bar{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.m1bar .hi b{font-size:18px;display:block;line-height:1.3}.m1bar .hi small{color:var(--muted);font-size:12.5px}
.strip{display:flex;gap:0;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:12px;margin-inline-start:auto;box-shadow:var(--shadow)}
.strip .st{display:flex;align-items:center;gap:8px;padding:8px 16px;border-inline-start:1px solid var(--line);font-size:13px;color:var(--muted)}
.strip .st:first-child{border-inline-start:0}
.strip .st b{font-size:17px;color:var(--text)}
.strip em{font-style:normal;font-size:12px;color:var(--primary-700);background:var(--primary-04);border-radius:999px;padding:1px 8px}
.strip .al{color:var(--or-800)} .dotw{width:8px;height:8px;border-radius:50%;background:var(--or)}
.avs{display:inline-flex}.avs .av{width:28px;height:28px;font-size:10px;margin-inline-start:-6px;border:2px solid var(--surface)}.avs .av:first-child{margin-inline-start:0}.avs .more{background:var(--surface-2);color:var(--muted)}
.v1 .mapcard.tall .mapwrap{min-height:560px}

/* ---------- M2 bento ---------- */
.bento{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:14px;grid-auto-flow:dense}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px;min-width:0;box-shadow:var(--shadow);position:relative}
.tile .t-h{display:flex;align-items:baseline;gap:4px 10px;flex-wrap:wrap;margin-bottom:8px}
.tile .t-h h2{font-size:15px;margin:0}.tile .t-h small{color:var(--faint);font-size:12px}
.tile .t-h .seg{margin-inline-start:auto}
.tile.hero{grid-column:span 5;grid-row:span 2;display:flex;flex-direction:column}
.giant{font-size:clamp(56px,7vw,96px);line-height:1;margin:6px 0 10px;font-weight:700;letter-spacing:-1px;color:var(--text)}
.hero-s{margin:0 0 6px;color:var(--muted);font-size:13px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.hero .ec{margin-top:auto}
.hero-f{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;border-top:1px solid var(--line);padding-top:12px;margin-top:10px;font-size:12px;color:var(--muted)}
.hero-f b{display:block;font-size:18px;color:var(--text)}
.tile.tmap{grid-column:span 7;grid-row:span 2;padding:0;overflow:hidden;min-height:540px}
.tile.ai{grid-column:span 4;background:var(--primary-700);border-color:var(--primary-700);color:#fff;display:flex;flex-direction:column;gap:10px}
.tile.ai .ai-h{display:flex;gap:8px;align-items:center}.tile.ai h2{font-size:15px;margin:0}
.tile.ai .sparkle{color:var(--primary-200)}
.tile.ai .ai-a{margin:0;font-size:14px;line-height:1.8;min-height:50px;color:#E7F1F1}.tile.ai .ai-a b{color:#fff}
.tile.ai .ai-chips button{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.22);color:#fff}
.tile.ai .ai-chips button:hover{background:rgba(255,255,255,.16)}
.ai-in{display:flex;gap:6px;margin-top:auto;background:#fff;border-radius:10px;padding:4px}
.ai-in input{flex:1;border:0;outline:0;padding:6px 10px;min-width:0;color:var(--text);background:none}
.ai-in button{border:0;background:var(--primary);color:#fff;width:36px;height:36px;border-radius:8px;display:grid;place-items:center}
.tile.tree{grid-column:span 8}
.tile.cover{grid-column:span 4;display:flex;flex-direction:column}
.tile.cover .mid{font-size:15px;color:var(--muted);margin:0 0 10px}.tile.cover .mid b{font-size:40px;color:var(--text);line-height:1}
.waffle{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:5px;margin-bottom:10px;max-width:280px}
.waffle i{aspect-ratio:1;border-radius:4px;background:repeating-linear-gradient(45deg,var(--surface-2) 0 3px,var(--line) 3px 4px)}
.waffle i.on{background:var(--primary)}
.tile.cover small{color:var(--muted);font-size:12.5px;margin-top:auto}
.tile.rose,.tile.polar{grid-column:span 4}
.polar-w{position:relative}.polar-c{position:absolute;inset:0;display:grid;place-content:center;text-align:center;pointer-events:none}
.polar-c b{font-size:26px;line-height:1;color:var(--or-800)}.polar-c small{font-size:11.5px;color:var(--muted)}
.mini-leg{list-style:none;margin:6px 0 0;padding:0;font-size:12px;color:var(--muted);display:flex;flex-direction:column;gap:2px}
.mini-leg i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-inline-end:6px;background:var(--primary)}.mini-leg i.o{background:var(--or)}
.tile.trend{grid-column:span 12}

/* ---------- M3 story ---------- */
.v3{gap:0}
.story{display:grid;grid-template-columns:minmax(340px,440px) minmax(0,1fr);gap:20px;align-items:start}
.st-map{position:sticky;top:16px;height:calc(100vh - 32px);min-height:520px;border-radius:12px;overflow:hidden;border:1px solid var(--line);box-shadow:var(--shadow)}
.chapters{display:flex;flex-direction:column;gap:0}
.st-h{padding:8px 0 28px}.st-h h1{font-size:28px;margin:4px 0;line-height:1.35}.st-h p{color:var(--muted);margin:0}
.chap{position:relative;padding:22px 20px 26px;border:1px solid var(--line);border-radius:12px;background:var(--surface);margin-bottom:38vh;opacity:.55;transition:opacity .3s, border-color .3s;box-shadow:var(--shadow)}
.chap:last-child{margin-bottom:24px}
.chap.on{opacity:1;border-color:var(--primary-200)}
.chap .no{font-size:12px;color:var(--primary-700);background:var(--primary-04);border-radius:999px;padding:2px 10px}
.chap h2{font-size:20px;margin:10px 0 4px}
.cbig{margin:0 0 6px;color:var(--muted);font-size:14px;display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}.cbig b{font-size:38px;color:var(--text);line-height:1.1}
.chap > p{margin:0 0 12px;color:var(--text);line-height:1.9}
.chap .btn{margin-top:12px}
.leg3{display:flex;gap:14px;font-size:12px;color:var(--muted)}.leg3 i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-inline-end:5px;vertical-align:-1px}
.gwrap .card-h{display:none}
.ask3 .cbig{font-size:18px;color:var(--text);align-items:center}
.ask3 .ai-a{margin:10px 0 0;font-size:14px;color:var(--text);min-height:24px}

/* ---------- M4 wall ---------- */
.ticker{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:6px 8px 6px 12px;overflow:hidden;box-shadow:var(--shadow)}
.tk-live{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:700;color:var(--primary-700);flex:none;padding-inline-end:10px;border-inline-end:1px solid var(--line)}
.tk-live i{width:8px;height:8px;border-radius:50%;background:var(--primary);animation:pulse4 1.6s infinite}
@keyframes pulse4{50%{box-shadow:0 0 0 5px rgba(15,118,110,.15)}}
.tk-view{overflow:hidden;flex:1;min-width:0;mask-image:linear-gradient(to left,transparent,#000 4%,#000 96%,transparent)}
.tk-track{display:flex;width:max-content;animation:tick 48s linear infinite}
.ticker:hover .tk-track,.ticker.paused .tk-track,.ticker:focus-within .tk-track{animation-play-state:paused}
@keyframes tick{from{transform:translateX(0)}to{transform:translateX(50%)}}
.tk-dup{display:flex}
.tk{display:inline-flex;align-items:center;gap:6px;font-size:13px;white-space:nowrap;padding:0 18px;color:var(--muted)}
.tk b{color:var(--text);font-weight:600}.tk time{color:var(--faint);font-size:12px}
.tk i{width:7px;height:7px;border-radius:50%;background:var(--primary-400)}.tk.warn i,.tk.bad i{background:var(--or)}
.icon-btn.sm{width:34px;height:34px;flex:none}
.gauges{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.gcard{padding:16px 16px 14px;text-align:center}
.gcard h2{font-size:14px;margin:0;font-weight:600;color:var(--muted)}
.gcard .gs{margin:-14px 0 4px;font-size:13px;color:var(--text);font-weight:600}
.gcard .gm{margin:0;font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px;justify-content:center}
.gcard .gm i{width:7px;height:7px;border-radius:50%;background:var(--primary)}
.gcard.warn .gm{color:var(--or-800)}.gcard.warn .gm i{background:var(--or)}
.g4{gap:14px}

/* ---------- M5 conversation ---------- */
.c5{max-width:820px;width:100%;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.c5-h{text-align:center;padding:28px 0 8px}
.c5-h .sparkle.lg svg{width:36px;height:36px}
.c5-h h1{font-size:28px;margin:8px 0 4px;line-height:1.4}.c5-h p{margin:0;color:var(--muted)}
.thread5{display:flex;flex-direction:column;gap:22px}
.qa5{display:flex;flex-direction:column;gap:10px;scroll-margin-top:16px}
.uq{align-self:flex-start;background:var(--primary-04);color:var(--primary-700);border-radius:14px 14px 14px 4px;padding:8px 14px;margin:0;font-weight:600;max-width:80%}
.aa{display:flex;gap:12px;align-items:flex-start}
.aa > .sparkle{width:34px;height:34px;border-radius:50%;background:var(--surface);border:1px solid var(--line);display:grid;place-items:center;flex:none}
.ab{flex:1;min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px 18px;box-shadow:var(--shadow)}
.ab > p:first-child{margin-top:0;line-height:1.9}
.ab .src{margin-bottom:0}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin:12px 0}
.kpis div{background:var(--surface-2);border-radius:10px;padding:10px 12px}.kpis b{display:block;font-size:20px}.kpis small{color:var(--muted);font-size:12px}
.ans-map{height:380px;border-radius:10px;overflow:hidden;border:1px solid var(--line)}
.composer{position:sticky;bottom:12px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:10px;box-shadow:0 8px 24px #A3A3A333;display:flex;flex-direction:column;gap:8px;z-index:5}
.cin{display:flex;gap:8px}.cin input{flex:1;border:1px solid var(--line);border-radius:10px;padding:10px 14px;min-width:0;background:var(--surface-2)}
.cin input:focus{outline:2px solid var(--primary-200);background:#fff}

/* ---------- M6 mail ---------- */
.mail{display:grid;grid-template-columns:210px minmax(0,1.5fr) minmax(0,1fr);gap:0;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden;min-height:640px;box-shadow:var(--shadow)}
.folders{border-inline-end:1px solid var(--line);padding:14px 10px;display:flex;flex-direction:column;gap:10px;background:var(--neutral-50,#FAFAFA)}
.brand.sm{border:0;padding:0 4px 4px;margin:0}.brand.sm .logo{width:30px;height:30px}
.folders nav{display:flex;flex-direction:column;gap:2px}
.folders nav a{display:flex;align-items:center;gap:8px;padding:8px;border-radius:8px;text-decoration:none;color:var(--text);font-size:13px}
.folders nav a b{margin-inline-start:auto;font-size:12px;color:var(--muted);font-weight:500}
.folders nav a.on{background:var(--primary-04);color:var(--primary-700);font-weight:600}
.folders nav a:hover{background:var(--surface-2)}
.fgoal{margin-top:auto;border-top:1px solid var(--line);padding-top:12px;text-align:center}
.fgoal b{font-size:13px;display:block}.fgoal small{color:var(--muted);font-size:12px}
.mail .inbox{border:0;border-radius:0;box-shadow:none;margin:0;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);height:100%}
.pane-map{border-inline-start:1px solid var(--line);min-height:420px}
.pane-map .mapcard{border-radius:0}

/* ---------- M7 flow ---------- */
.flow{padding:20px 20px 8px}
.fl-h{display:flex;gap:12px 32px;align-items:flex-end;flex-wrap:wrap;margin-bottom:8px}
.fl-h h2{font-size:22px;margin:0;line-height:1.4}.fl-n{margin:0;color:var(--muted);font-size:13px;max-width:52ch}
.fl-sc{overflow-x:auto}
.flsvg{width:100%;min-width:680px;height:auto;display:block;font-family:var(--f-body)}
.flsvg .fl{fill:var(--primary-08);opacity:.85}
.flsvg .nd{fill:var(--primary-400)}.flsvg .nd.fin{fill:var(--primary-700)}
.flsvg .dr{fill:#EDEDED}.flsvg .dr.big{fill:#FFD9C7}
.flsvg .lb{font-size:13px;font-weight:700;fill:var(--text)}.flsvg .lbn{font-size:12px;fill:var(--muted)}
.flsvg .sn{cursor:pointer;outline:none}
.flsvg .sn rect{fill:var(--slate)}.flsvg .sn text{font-size:12px;fill:var(--muted)}.flsvg .sn .n{font-weight:700;fill:var(--text)}
.flsvg .sn.big rect{fill:var(--or)}.flsvg .sn.big text,.flsvg .sn.big .n{fill:var(--or-800)}
.flsvg .sn:hover rect,.flsvg .sn:focus-visible rect,.flsvg .sn.sel rect{stroke:var(--text);stroke-width:2}
.flsvg .sn:focus-visible text{text-decoration:underline}

/* ---------- responsive ---------- */
@media (max-width:1180px){
  body[data-shell] .shell{grid-template-columns:minmax(0,1fr)}
  body[data-shell] .side{display:none}
  .tile.hero,.tile.tmap{grid-column:span 12;grid-row:auto}
  .tile.ai,.tile.cover,.tile.rose,.tile.polar{grid-column:span 6}
  .tile.tree{grid-column:span 12}
  .gauges{grid-template-columns:repeat(2,minmax(0,1fr))}
  .mail{grid-template-columns:minmax(0,1.4fr) minmax(0,1fr)}
  .folders{display:none}
}
@media (max-width:900px){
  .story{grid-template-columns:minmax(0,1fr)}
  .st-map{position:relative;top:0;height:500px;min-height:0;order:-1}
  .chap{margin-bottom:24px;opacity:1}
  .mail{grid-template-columns:minmax(0,1fr)}
  .mail .inbox{grid-template-columns:minmax(0,1fr)}
  .pane-map{border-inline-start:0;border-top:1px solid var(--line);height:360px}
  .strip{margin-inline-start:0;width:100%}
}
@media (max-width:640px){
  .tile.ai,.tile.cover,.tile.rose,.tile.polar{grid-column:span 12}
  .hero-f,.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .gauges{grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
  .gcard{padding:12px 8px}
  .strip .st{padding:6px 10px;flex:1 1 45%;border-inline-start:0;border-top:1px solid var(--line)}
  .strip .st:nth-child(-n+2){border-top:0}
  .c5-h h1,.st-h h1{font-size:22px}
  .uq{max-width:100%}
  .aa > .sparkle{display:none}
  .ab{padding:14px}
  .fl-h h2{font-size:18px}
}
@media (prefers-reduced-motion: reduce){ .tk-track{animation:none!important} .tk-view{overflow-x:auto} .tk-dup{display:none} }

/* ===================== scrollytelling variants ===================== */
.subsw{display:flex;align-items:center;gap:4px;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:4px;width:max-content;max-width:100%;box-shadow:var(--shadow);margin-bottom:16px}
.subsw > span{font-size:12px;color:var(--faint);padding:0 10px}
.subsw button{border:0;background:none;border-radius:8px;padding:6px 12px;font-size:13px;color:var(--muted);min-height:34px}
.subsw button b{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:6px;background:var(--surface-2);font-size:11.5px;margin-inline-end:4px;color:var(--text)}
.subsw button[aria-pressed="true"]{background:var(--primary-04);color:var(--primary-700);font-weight:600}
.subsw button[aria-pressed="true"] b{background:var(--primary);color:#fff}
.kick{display:flex;align-items:center;gap:8px;margin:0;font-size:12.5px;font-weight:600;color:var(--primary-700)}
.kick .num{background:var(--primary-04);border-radius:999px;padding:1px 9px;font-weight:700}

/* A · editorial */
.sa .st-h h1{font-size:30px;line-height:1.45;margin:6px 0 10px;text-wrap:balance}
.byline{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:13px;margin:0 0 16px!important}
.byline .av{width:28px;height:28px;font-size:12px;background:var(--primary);color:#fff}
.toc{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:6px}
.toc a{display:flex;align-items:center;gap:6px;text-decoration:none;color:var(--muted);font-size:12.5px;border:1px solid var(--line);border-radius:999px;padding:4px 10px 4px 12px;background:var(--surface)}
.toc a .num{font-weight:700;color:var(--faint)}
.toc a[aria-current]{border-color:var(--primary-200);color:var(--primary-700);background:var(--primary-04)}
.prog{position:sticky;top:0;z-index:4;height:3px;background:var(--line);border-radius:3px;margin:0 0 20px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--primary);transform-origin:right;transform:scaleX(0)}
.sa .chap{margin-bottom:28vh;padding:22px 22px 18px}
.sa .chap h2{font-size:21px;line-height:1.5;margin:8px 0 6px;text-wrap:balance}
.sa .chap > p{color:var(--muted);font-size:14.5px}
.fig{margin:14px 0 0;padding:12px 0 0;border-top:1px solid var(--line)}
.fig figcaption{font-size:11.5px;color:var(--faint);margin-top:6px}
.next{list-style:none;margin:12px 0 0;padding:0;display:flex;flex-direction:column;gap:8px}
.next button{width:100%;text-align:right;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 14px;display:flex;flex-direction:column;gap:2px}
.next button:hover{border-color:var(--primary-200);background:var(--primary-04)}
.next small{color:var(--muted);font-size:12.5px}
.m-cap{right:12px;bottom:12px;max-width:320px;padding:10px 14px;font-size:12.5px;display:flex;flex-direction:column;gap:2px;z-index:500}
.m-cap b{font-size:12px;color:var(--primary-700)}
@container (max-width:980px){ .m-cap{bottom:12px;right:12px;left:auto;max-width:260px} .m-legend{display:none} }

/* B · full-bleed map */
.v3 .sb{position:relative;margin-inline:-4px}
.sb-map{position:sticky;top:0;height:100vh;border-radius:14px;overflow:hidden;border:1px solid var(--line)}
.sb-steps{position:relative;margin-top:-100vh;pointer-events:none;padding:24vh 24px 30vh;display:flex;flex-direction:column;align-items:flex-start}
.sb-card{pointer-events:auto;width:420px;max-width:100%;background:rgba(255,255,255,.96);backdrop-filter:blur(8px);border:1px solid var(--line);border-radius:14px;padding:20px 22px;box-shadow:0 12px 32px #A3A3A333;margin-bottom:62vh;opacity:.7;transition:opacity .3s,transform .3s}
.sb-card.on{opacity:1}
.sb-card h1{font-size:28px;line-height:1.4;margin:4px 0 8px}
.sb-card h2{font-size:19px;line-height:1.5;margin:8px 0 6px}
.sb-card > p{color:var(--muted);margin:0 0 12px;line-height:1.9}
.sb-card.end{margin-bottom:0}
.scroll-hint{display:inline-grid;place-items:center;width:34px;height:34px;border-radius:50%;background:var(--primary-04);color:var(--primary-700);animation:bob 1.6s infinite}
@keyframes bob{50%{transform:translateY(4px)}}
.sb-dots{position:absolute;top:0;bottom:0;left:16px;display:flex;flex-direction:column;justify-content:center;gap:8px;pointer-events:none}
.sb-dots{position:sticky;top:50vh;height:0;margin-top:0}
.sb-dots i{display:block;width:8px;height:8px;border-radius:50%;background:var(--line-2);transition:height .3s}
.sb-dots i.on{background:var(--primary);height:22px;border-radius:4px}
.bullet{position:relative;height:30px;margin:4px 0 6px}
.bl-r{position:absolute;inset:0;display:flex;border-radius:6px;overflow:hidden}
.bl-r i{height:100%;background:var(--surface-2)}.bl-r i:nth-child(2){background:#EDEDED}.bl-r i:nth-child(3){background:var(--line)}
.bullet b{position:absolute;right:0;top:10px;height:10px;background:var(--primary);border-radius:3px 0 0 3px}
.bullet u{position:absolute;top:3px;bottom:3px;width:3px;background:var(--text);border-radius:2px}
.bl-l{display:flex;justify-content:space-between;font-size:11.5px;color:var(--muted)}
.units{display:grid;grid-template-columns:repeat(21,minmax(0,1fr));gap:3px;margin:4px 0 8px}
.units i{aspect-ratio:1;border-radius:50%}
.u-leg{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:11.5px;color:var(--muted)}
.u-leg i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-inline-end:4px;vertical-align:-1px}

/* C · morphing chart */
.sc-h{max-width:640px;margin:0 0 8px}.sc-h h1{font-size:30px;margin:4px 0 6px;line-height:1.4}.sc-h p{color:var(--muted);margin:0}
.sc{display:grid;grid-template-columns:minmax(300px,400px) minmax(0,1fr);gap:28px;align-items:start}
.sc-steps{padding:22vh 0 30vh}
.sc-step{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px 20px;margin-bottom:50vh;opacity:.45;transition:opacity .3s,border-color .3s;box-shadow:var(--shadow)}
.sc-step:last-child{margin-bottom:0}
.sc-step.on{opacity:1;border-color:var(--primary-200)}
.sc-step h2{font-size:19px;line-height:1.5;margin:8px 0 6px}.sc-step p{margin:0;color:var(--muted);line-height:1.9}
.sc-panel{position:sticky;top:16px;height:calc(100vh - 32px);min-height:480px;background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);display:flex;flex-direction:column;padding:18px 20px 14px}
.sc-ph{display:flex;align-items:flex-start;gap:12px;border-bottom:1px solid var(--line);padding-bottom:10px}
.sc-ph b{display:block;font-size:15px}.sc-ph small{color:var(--faint);font-size:11.5px}
.sc-n{margin-inline-start:auto;font-size:12px;color:var(--primary-700);background:var(--primary-04);border-radius:999px;padding:2px 10px;white-space:nowrap}
.sc-chart{flex:1;min-height:0}
.sc-pips{display:flex;justify-content:center;gap:6px;padding-top:8px}
.sc-pips button{width:28px;height:28px;border:0;background:none;display:grid;place-items:center;padding:0}
.sc-pips button::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--line-2);transition:width .3s}
.sc-pips button[aria-pressed="true"]::before{width:22px;border-radius:4px;background:var(--primary)}
.sc-end{display:grid;grid-template-columns:minmax(300px,400px) minmax(0,1fr);gap:28px;align-items:start;margin-top:32px}
.sc-endh h2{font-size:22px;margin:8px 0 12px}.sc-endh .ai-a{margin-top:12px}

@media (max-width:900px){
  .sb-map{height:100svh;border-radius:0}
  .sb-steps{padding:40vh 12px 30vh;align-items:stretch}
  .sb-card{width:auto;margin-bottom:55vh}
  .sb-dots{display:none}
  .sc,.sc-end{grid-template-columns:minmax(0,1fr)}
  .sc-panel{top:0;height:52svh;min-height:340px;z-index:5;order:-1;border-radius:0 0 14px 14px;padding:12px}
  .sc-steps{padding:4vh 0 20vh}
  .sc-step{margin-bottom:40vh;position:relative;z-index:1}

function pipRing(pt, ring){ let x=pt[0], y=pt[1], ins=false;

function pipGeo(pt, g){ const polys = g.type==='Polygon'?[g.coordinates]:g.coordinates; return polys.some(pl=>pipRing(pt,pl[0])); }

D.cities.forEach(c=>c.ring=ll2(c.b)); D.regions.forEach(r=>r.ring=ll2(r.b)); D.hoods.forEach(h=>h.ring=ll2(h.b));
function areaHa(ll){ if(ll.length<3) return 0; const R=6378137; let a=0;
  for(let i=0;i<ll.length;i++){ const p1=ll[i], p2=ll[(i+1)%ll.length]; a += (p2.lng-p1.lng)*Math.PI/180 * (2+Math.sin(p1.lat*Math.PI/180)+Math.sin(p2.lat*Math.PI/180)); }

  polys.forEach(pl=>{ const r=pl[0]; let a=0,cx=0,cy=0; for(let i=0,j=r.length-1;i<r.length;j=i++){ const f=r[j][0]*r[i][1]-r[i][0]*r[j][1]; a+=f; cx+=(r[j][0]+r[i][0])*f; cy+=(r[j][1]+r[i][1])*f; }
    a/=2; if(Math.abs(a)>ba){ ba=Math.abs(a); best=[cy/(6*a), cx/(6*a)]; } }); return best?L.latLng(best[0],best[1]):null; }

const SEARCH = () => [...PROV.map(p=>({t:'استان '+p.fa,s:p.props?fa(p.props)+' ملک':'بدون داده',k:'p',id:p.en})), ...D.cities.map(c=>({t:'شهر '+c.n,s:'استان '+provBy[c.p].fa,k:'c',id:c.id})), ...D.hoods.map(h=>({t:'محله '+h.n,s:h.regObj.n+'، '+h.cityObj.n,k:'h',id:h.id}))];
function wireMap(root, mv){
  $$('.m-zoom button',root).forEach(b=>b.onclick=()=>{ const z=b.dataset.z; if(z==='in') mv.map.zoomIn(); if(z==='out') mv.map.zoomOut(); if(z==='home') mv.goLevel(0);
    if(z==='me'){ mv.goBounds(mv.cityL.teh.getBounds(),2); mv.toast('محدوده دسترسی شما استان تهران است.'); } });
  const menu=$('.cta-menu',root);
  const areaEl=()=>$('.m-area',root);
  if(menu){ $('.cta-more',root).setAttribute('aria-expanded','false');
    mv.setMenu=o=>{ if(!o&&menu.hidden) return; menu.hidden=!o; $('.cta-more',root).setAttribute('aria-expanded',o); $$('.m-area,.lp,.timebar',root).forEach(a=>a.style.visibility=o?'hidden':''); if(o){ const f=$('button',menu); f&&f.focus({preventScroll:true}); } };

      res.innerHTML = items.length? items.map((x,i)=>`<button role="option" data-i="${i}">${ic(x.k==='p'?'map':x.k==='c'?'building':'loc','s')}${x.t}<small>${x.s}</small></button>`).join('') : `<div style="padding:10px;color:var(--muted);font-size:13px">چیزی پیدا نشد. نام دیگری را امتحان کنید.</div>`;
      res.hidden=false; $$('button',res).forEach(b=>b.onclick=()=>{ const x=items[+b.dataset.i]; res.hidden=true; si.value='';
        if(x.k==='p') mv.goBounds(mv.provL[x.id].getBounds(),1); if(x.k==='c') mv.goBounds(mv.cityL[x.id].getBounds(),2); if(x.k==='h') mv.goBounds(mv.hoodL[x.id].getBounds(),4); }); };
    si.oninput=run; si.onkeydown=e=>{ if(e.key==='Enter'){ const f=$('button',res); if(f) f.click(); } if(e.key==='Escape'){ res.hidden=true; } }; }
  // filter popover
  const ft=$('[data-ftoggle]',root), fp=$('[data-fpop]',root), area=$('.m-area',root);
  if(ft){ const cta=$('.m-cta',root); const setOpen=o=>{ fp.hidden=!o; ft.setAttribute('aria-expanded',o); if(area) area.style.visibility=o?'hidden':''; if(cta) cta.style.visibility=o?'hidden':''; if(!o) ft.focus({preventScroll:true}); }; mv.setFilter=setOpen;
    ft.onclick=()=>setOpen(fp.hidden); $('[data-fclose]',fp).onclick=()=>setOpen(false); wireFilters(fp, mv, ()=>{
      const n=Object.values(mv.st.layers).filter(v=>!v).length + (mv.st.status!=='all'?1:0) + ($('[data-f=prov]',fp).value?1:0); const b=$('[data-fcount]',root); b.hidden=!n; b.textContent=fa(n); }); }
  $$('.ov',root).forEach(o=>{ L.DomEvent.disableClickPropagation(o); L.DomEvent.disableScrollPropagation(o); });
  const close=()=>mv.closeMenu(); document.addEventListener('click',close); cleanup.push(()=>document.removeEventListener('click',close));
  root.addEventListener('keydown',e=>{ if(e.key!=='Escape') return; const m=$('.cta-menu',root); if(m&&!m.hidden){ mv.closeMenu(); $('.cta-more',root).focus(); return; }
    const f=$('[data-fpop]',root); if(f&&!f.hidden&&mv.setFilter){ mv.setFilter(false); return; } if(mv.drawing){ mv.cancelDraw(); } });
}
function wireFilters(root, mv, onChange=()=>{}){
  const sp=$('[data-f=prov]',root), sc=$('[data-f=city]',root), sr=$('[data-f=reg]',root), sh=$('[data-f=hood]',root);
  const fill=(sel,items,ph)=>{ sel.innerHTML=`<option value="">${ph}</option>`+items.map(i=>`<option value="${i[0]}">${i[1]}</option>`).join(''); sel.disabled=!items.length; };
  if(sp){ sp.onchange=()=>{ const v=sp.value; fill(sc, v?D.cities.filter(c=>c.p===v).map(c=>[c.id,c.n]):[], 'همه شهرها'); fill(sr,[],'همه مناطق'); fill(sh,[],'همه محله‌ها'); if(v) mv.goBounds(mv.provL[v].getBounds(),1); else mv.goLevel(0); onChange(); };
    sc.onchange=()=>{ const v=sc.value; fill(sr, v?D.regions.filter(r=>r.city===v).map(r=>[r.id,r.n+(r.nh?'':' (بدون محله)')]):[], 'همه مناطق'); fill(sh,[],'همه محله‌ها'); if(v) mv.goBounds(mv.cityL[v].getBounds(),2); };
    sr.onchange=()=>{ const v=sr.value; fill(sh, v?regBy[v].hoods.map(h=>[h.id,h.n]):[], 'همه محله‌ها'); if(v) mv.goBounds(mv.regL[v].getBounds(),3); };
    sh.onchange=()=>{ const v=sh.value; if(v) mv.goBounds(mv.hoodL[v].getBounds(),4); }; }
  $$('.chip[data-l]',root).forEach(b=>b.onclick=()=>{ const on=b.getAttribute('aria-pressed')!=='true'; b.setAttribute('aria-pressed',on); mv.setLayer(b.dataset.l,on); onChange(); });
  $$('[data-st]',root).forEach(b=>b.onclick=()=>{ $$('[data-st]',root).forEach(x=>x.setAttribute('aria-pressed',x===b)); mv.setStatus(b.dataset.st); onChange(); });
  const rs=$('[data-reset]',root); if(rs) rs.onclick=()=>{ if(sp){ sp.value=''; sp.onchange(); } $$('.chip[data-l]',root).forEach(b=>{ b.setAttribute('aria-pressed','true'); mv.st.layers[b.dataset.l]=true; }); $$('[data-st]',root).forEach((x,i)=>x.setAttribute('aria-pressed',!i)); mv.st.status='all'; mv.update(); onChange(); };
}

const DAYS=365; const TYPES={prop:{fa:'املاک',w:1},land:{fa:'اراضی',w:.32},street:{fa:'معابر',w:.22}};
const SERIES=(()=>{ const out={prop:[],land:[],street:[]}, dates=[];
  for(let i=DAYS*2-1;i>=0;i--){ const d=new Date(TODAY); d.setDate(d.getDate()-i); dates.push(d); const dow=d.getDay();
    const growth=0.45+0.55*((DAYS*2-i)/(DAYS*2)); const wk=dow===5?0.1:dow===4?0.55:1; const camp=(i>40&&i<62)?1.45:1;
    Object.entries(TYPES).forEach(([k,t])=>{ const base=14*t.w*growth*wk*camp; out[k].push(Math.max(0,Math.round(base+(rnd()-.5)*base*0.6))); }); }
  return {dates,...out}; })();
const sum = a => a.reduce((x,y)=>x+y,0);

  </div>`; }

/* trend */
function trendSection(o={}){ const id='tr'+Math.random().toString(36).slice(2,7);
  return `<section class="card" id="${id}" data-trend aria-labelledby="${id}-h">
    <div class="card-h"><span class="ic-badge">${ic('trend')}</span><h2 id="${id}-h">روند ثبت داده</h2>
      <div class="act"><div class="seg" role="group" aria-label="نوع داده" data-t="type"><button aria-pressed="true" data-v="prop">املاک</button><button aria-pressed="false" data-v="land">اراضی</button><button aria-pressed="false" data-v="street">معابر</button></div>
      <div class="seg" role="group" aria-label="بازه زمانی" data-t="period"><button aria-pressed="true" data-v="30">۳۰ روز</button><button aria-pressed="false" data-v="90">۳ ماه</button><button aria-pressed="false" data-v="365">۱۲ ماه</button></div></div></div>
    <p class="lead" data-insight></p>
    <div class="tchart"><div class="tleg"></div><svg class="chart" role="img" height="${o.h||230}"></svg><div class="ttip glass"></div></div>
    <div style="display:flex;justify-content:space-between;align-items:center;margin-top:6px;flex-wrap:wrap;gap:8px"><label class="tgl"><input type="checkbox" data-t="cmp" checked> مقایسه با دوره قبل</label><span class="src" style="margin:0">منبع: «تاریخ ثبت در سیستم» در فرم ملک</span></div>
  </section>`; }
function initTrend(sec){
  const S2={type:'prop',period:30,cmp:true};
  const draw=()=>{ const n=S2.period, arr=SERIES[S2.type], tname=TYPES[S2.type].fa; let cur, prev, labels, dates, unit;
    if(n===30){ cur=arr.slice(-30); prev=arr.slice(-60,-30); dates=SERIES.dates.slice(-30); unit='روز'; }
    else if(n===90){ cur=[];prev=[];dates=[]; for(let w=12;w>=0;w--){ const e=arr.length-w*7; cur.push(sum(arr.slice(e-7,e))); prev.push(sum(arr.slice(e-7-91,e-91))); dates.push(SERIES.dates[e-1]); } unit='هفته'; }
    else { cur=[];prev=[];dates=[]; for(let m=11;m>=0;m--){ const e=arr.length-m*30; cur.push(sum(arr.slice(e-30,e))); prev.push(sum(arr.slice(e-30-365,e-365))); dates.push(SERIES.dates[e-1]); } unit='ماه'; }
    const T=sum(cur), PT=sum(prev), dl=PT?Math.round((T-PT)/PT*100):0; const mx=Math.max(...cur), mi=cur.indexOf(mx);
    const lab = d => n===365?jalMon.format(d):jal.format(d);
    const period = n===30?'۳۰ روز اخیر':n===90?'۳ ماه اخیر':'۱۲ ماه اخیر';
    $('[data-insight]',sec).innerHTML = `در ${period} <strong>${fa(T)} ${tname}</strong> ثبت شد؛ ${dl>=0?`<strong class="up">${faPct(dl)} بیشتر</strong>`:`<strong class="dn">${faPct(-dl)} کمتر</strong>`} از دوره قبل. بیشترین ثبت در ${n===30?'روز':unit} ${lab(dates[mi])} بود.`;
    // moving average for daily
    const ma = n===30 ? cur.map((_,i)=>{ const s=arr.slice(arr.length-30+i-6, arr.length-30+i+1); return sum(s)/s.length; }) : null;
    const pma = n===30 ? prev.map((_,i)=>{ const s=arr.slice(arr.length-60+i-6, arr.length-60+i+1); return sum(s)/s.length; }) : null;
    $('.tleg',sec).innerHTML = `<span><i class="lg-sw" style="background:var(--d2)"></i>ثبت هر ${unit}</span>${n===30?`<span><i class="lg-ln" style="border-color:var(--d5)"></i>میانگین ۷ روزه</span>`:''}${S2.cmp?`<span><i class="lg-ln" style="border-color:var(--coral-700);border-top-style:dashed;border-top-width:2px"></i>دوره قبل</span>`:''}${n===30?`<span><i class="lg-sw lg-hatch"></i>جمعه</span>`:''}`;
    const svg=$('svg.chart',sec), W=svg.clientWidth||600, H=+svg.getAttribute('height'), pl=6, pr=36, pt=14, pb=26;
    const cmpSeries = n===30?pma:prev; const top = Math.max(...cur, ...(S2.cmp?cmpSeries:[0]))*1.1||1; const nice=niceMax(top);
    const cnt=cur.length, bw=(W-pr-pl)/cnt; const x=i=>W-pr-(i+0.5)*bw; const y=v=>pt+(1-v/nice)*(H-pt-pb);
    let g='';
    for(let k=0;k<=4;k++){ const v=nice*k/4; g+=`<line x1="${pl}" x2="${W-pr}" y1="${y(v)}" y2="${y(v)}" stroke="#E5E5E5"/><text x="${W-pr+6}" y="${y(v)+4}">${fa(v)}</text>`; }
    cur.forEach((v,i)=>{ const fri=n===30&&dates[i].getDay()===5; const h=Math.max(1.5,y(0)-y(v));
      g+=`<rect x="${x(i)-bw*0.36}" y="${y(0)-h}" width="${bw*0.72}" height="${h}" rx="${Math.min(4,bw*.2)}" fill="${fri?'url(#hatch)':i===cnt-1?'#0F766E':'#CFE4E2'}"/>`; });
    const path=a=>a.map((v,i)=>`${i?'L':'M'}${x(i).toFixed(1)},${y(v).toFixed(1)}`).join('');
    if(S2.cmp) g+=`<path d="${path(cmpSeries)}" fill="none" stroke="#B8452D" stroke-width="2" stroke-dasharray="5 4" stroke-linejoin="round"/>`;
    if(ma){ g+=`<path d="${path(ma)}" fill="none" stroke="#0C5E58" stroke-width="2.6" stroke-linejoin="round"/><circle cx="${x(cnt-1)}" cy="${y(ma[cnt-1])}" r="4.5" fill="#0C5E58" stroke="#fff" stroke-width="2"/>`; }
    g+=`<text x="${x(mi)}" y="${y(mx)-6}" text-anchor="middle" style="fill:#171717;font-weight:700">${fa(mx)}</text>`;
    const ticks=n===365?6:n===90?5:5; for(let k=0;k<ticks;k++){ const i=Math.round(k*(cnt-1)/(ticks-1)); g+=`<text x="${x(i)}" y="${H-6}" text-anchor="middle">${lab(dates[i])}</text>`; }
    g+=`<rect class="hit" x="${pl}" y="0" width="${W-pr-pl}" height="${H}" fill="transparent"/>`;
    svg.setAttribute('viewBox',`0 0 ${W} ${H}`); svg.innerHTML=g; svg.setAttribute('aria-label',$('[data-insight]',sec).textContent);
    const tip=$('.ttip',sec), hit=$('.hit',svg);
    hit.onmousemove=e=>{ const r=svg.getBoundingClientRect(); let i=Math.floor((W-pr-(e.clientX-r.left))/bw); i=Math.max(0,Math.min(cnt-1,i)); const d=dates[i];
      tip.innerHTML=`<b>${n===30?jalFull.format(d):n===90?'هفته منتهی به '+jal.format(d):jalMon.format(d)}</b>${row(tname,fa(cur[i]))}${S2.cmp?row('دوره قبل',fa(Math.round(cmpSeries[i]))):''}${n===30&&d.getDay()===5?'<div class="r"><span>جمعه، تعطیل</span></div>':''}`;
      tip.style.display='block'; const tx=x(i)-tip.offsetWidth-14<0?x(i)+14:x(i)-tip.offsetWidth-14; tip.style.left=tx+'px'; tip.style.top='34px'; };
    hit.onmouseleave=()=>tip.style.display='none'; };
  $$('[data-t=type] button',sec).forEach(b=>b.onclick=()=>{ $$('[data-t=type] button',sec).forEach(x=>x.setAttribute('aria-pressed',x===b)); S2.type=b.dataset.v; draw(); });
  $$('[data-t=period] button',sec).forEach(b=>b.onclick=()=>{ $$('[data-t=period] button',sec).forEach(x=>x.setAttribute('aria-pressed',x===b)); S2.period=+b.dataset.v; draw(); });
  $('[data-t=cmp]',sec).onchange=e=>{ S2.cmp=e.target.checked; draw(); };
  draw(); const ro=new ResizeObserver(()=>draw()); ro.observe($('.tchart',sec)); return ro; }
function niceMax(v){ const p=Math.pow(10,Math.floor(Math.log10(v))); const n=v/p; return (n<=1?1:n<=2?2:n<=2.5?2.5:n<=5?5:10)*p; }

function flyTo(fn){ const mv=S.map; if(!mv||!fn) return; $('.mapcard').scrollIntoView({behavior:'smooth',block:'start'}); setTimeout(()=>fn(mv),350); }

   projects, registration trend) gets a different pattern in each model.
